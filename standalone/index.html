<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>ERP Keuangan Sekolah Rakyat</title>
  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <style>
:root{--bg:#0f172a;--panel:#111827;--card:#1e293b;--line:#334155;--txt:#e2e8f0;--muted:#94a3b8;--brand:#22c55e;--brand-2:#16a34a;--accent:#38bdf8;--warn:#f59e0b;--danger:#ef4444;--ok:#22c55e}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:#f1f5f9;color:#0f172a;font-size:14px}
.app{display:flex;min-height:100vh}
.sidebar{width:248px;background:linear-gradient(180deg,var(--bg),var(--panel));color:#e2e8f0;padding:18px 14px;flex-shrink:0;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.brand .logo{width:38px;height:38px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,var(--brand),var(--accent));display:flex;align-items:center;justify-content:center;font-weight:800;color:#04210f}
.brand .logo img{width:34px;height:34px;border-radius:8px;object-fit:cover}
.brand b{font-size:15px;line-height:1.1}.brand small{color:var(--muted);font-size:11px}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:6px;flex:1;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;color:#cbd5e1;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;transition:.15s}
.nav button:hover{background:#1f2937;color:#fff}
.nav button.active{background:linear-gradient(90deg,var(--brand-2),#0e7a37);color:#fff;font-weight:600}
.nav .ico{width:18px;text-align:center}
.nav .sub-nav{margin-left:28px;display:flex;flex-direction:column;gap:2px}
.nav .sub-nav button{padding:7px 12px;font-size:12.5px}
.nav .section-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:12px 12px 4px;font-weight:700}
.sidebar .school{margin-top:12px;padding:12px;border:1px solid #1f2937;border-radius:10px;background:#0b1220;font-size:12px;color:var(--muted)}
.sidebar .school b{color:#e2e8f0;display:block;font-size:13px;margin-top:2px}
.sidebar .user-info{margin-top:8px;padding:10px 12px;border:1px solid #1f2937;border-radius:10px;background:#0b1220;font-size:11.5px;color:var(--muted)}
.sidebar .user-info b{color:#e2e8f0}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:5}
.topbar h1{font-size:17px;margin:0}.topbar .sub{color:#64748b;font-size:12px;margin-top:2px}
.content{padding:22px;max-width:1100px;width:100%}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.stat .label{color:#64748b;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.stat .value{font-size:26px;font-weight:800;margin-top:8px;color:#0f172a}.stat .value.small{font-size:20px}
.stat .pill{display:inline-block;margin-top:8px;font-size:11px;padding:3px 8px;border-radius:999px}
.stat.green{border-top:3px solid var(--brand)}.stat.blue{border-top:3px solid var(--accent)}.stat.amber{border-top:3px solid var(--warn)}.stat.red{border-top:3px solid var(--danger)}
.pill.green{background:#dcfce7;color:#166534}.pill.amber{background:#fef3c7;color:#92400e}.pill.blue{background:#e0f2fe;color:#075985}
.panel{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin-top:18px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.panel h2{font-size:15px;margin:0 0 4px}.panel .desc{color:#64748b;font-size:12.5px;margin:0 0 14px}
.tabs{display:flex;gap:6px;border-bottom:1px solid #e2e8f0;margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:#64748b;font-size:13.5px;font-weight:600}
.tabs button.active{color:var(--brand-2);border-bottom-color:var(--brand-2)}
.tabpane{display:none}.tabpane.active{display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid #eef2f7;vertical-align:middle}
th{color:#64748b;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;background:#f8fafc}
td input,td select{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:8px;font-size:13px}
td input:focus,td select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
.right{text-align:right}.num{text-align:right;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn.primary{background:var(--brand-2);color:#fff}.btn.primary:hover{background:#0e7a37}
.btn.ghost{background:#f1f5f9;color:#334155}.btn.ghost:hover{background:#e2e8f0}
.btn.tiny{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.ok{background:#dcfce7;color:#166534}.btn.no{background:#fee2e2;color:#991b1b}
.btn:disabled{opacity:.55;cursor:not-allowed}
.row-actions{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:#475569;margin-bottom:5px;font-weight:600}
.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font-size:13.5px;font-family:inherit}
.field input[type="color"]{height:42px;padding:4px;cursor:pointer}
.field textarea{min-height:150px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.badge{padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.badge.pending{background:#fef3c7;color:#92400e}.badge.verified{background:#dcfce7;color:#166534}.badge.rejected{background:#fee2e2;color:#991b1b}
.badge.active{background:#dcfce7;color:#166534}.badge.inactive{background:#f1f5f9;color:#64748b}
.empty{text-align:center;color:#94a3b8;padding:26px 10px;font-size:13px}
.muted{color:#64748b}.mono{font-family:ui-monospace,Consolas,monospace}
.hint{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:12px;color:#475569;font-size:12.5px}
#toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:#0f172a;color:#fff;padding:11px 15px;border-radius:10px;font-size:13px;box-shadow:0 10px 25px rgba(0,0,0,.25);min-width:220px;max-width:340px;animation:slideIn .2s ease}
.toast.ok{background:#166534}.toast.err{background:#991b1b}
@keyframes slideIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:20px;width:480px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:slideIn .15s ease}
.modal h3{margin:0 0 14px;font-size:16px}
#loading{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;transition:width .3s;z-index:60}
.chart-panel{min-height:280px}.chart-panel .chart-box{width:100%;min-height:260px}
.access-denied{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;text-align:center;padding:30px}
.access-denied h1{font-size:28px;color:#991b1b;margin-bottom:10px}
.access-denied p{color:#64748b;font-size:15px;max-width:400px}
.access-denied .email{font-family:monospace;background:#f1f5f9;padding:6px 12px;border-radius:8px;margin-top:12px;color:#0f172a}
@media(max-width:820px){.app{flex-direction:column}.sidebar{width:100%}.nav{flex-direction:row;flex-wrap:wrap}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="loading"></div>
  <div id="appRoot" class="app" style="display:none">
    <aside class="sidebar">
      <div class="brand"><div class="logo" id="brandLogo">SR</div><div><b>ERP Keuangan</b><small>Sekolah Rakyat</small></div></div>
      <nav class="nav" id="nav"></nav>
      <div class="school">Sekolah Aktif<b id="schoolName">Memuat...</b><span class="mono" id="schoolId"></span><a id="sheetLink" href="#" target="_blank" style="display:none;color:#7dd3fc;font-size:11.5px;margin-top:8px">&#128203; Buka Spreadsheet</a></div>
      <div class="user-info" id="userInfo"></div>
    </aside>
    <div class="main">
      <header class="topbar"><div><h1 id="pageTitle">Dashboard</h1><div class="sub" id="pageSub">Ringkasan keuangan sekolah</div></div><button class="btn ghost" id="refreshBtn">&#8635; Muat Ulang</button></header>
      <main class="content" id="content"></main>
    </div>
  </div>
  <div id="accessDenied" style="display:none"></div>
  <div id="toast"></div>
  <div id="modal" class="modal-overlay"><div class="modal"><h3 id="modalTitle">Edit</h3><div id="modalBody"></div><div class="row-actions" style="justify-content:flex-end;margin-top:8px"><button class="btn ghost" type="button" onclick="closeModal()">Batal</button><button class="btn primary" type="button" id="modalSave">Simpan</button></div></div></div>

  <script>
    /* ===================== STATE & HELPERS ===================== */
    var STATE = { schoolId: null, schoolName: '', refs: {}, role: null, userEmail: '' };
    var loadingCount = 0;

    function showLoading(on){
      loadingCount += on ? 1 : -1;
      if (loadingCount < 0) loadingCount = 0;
      var bar = document.getElementById('loading');
      bar.style.width = loadingCount > 0 ? '85%' : '0';
      if (loadingCount === 0) setTimeout(function(){ bar.style.width='0'; }, 120);
    }

    function gcall(fn, payload){
      return new Promise(function(resolve, reject){
        if (typeof google === 'undefined' || !google.script || !google.script.run){
          reject(new Error('google.script.run tidak tersedia'));
          return;
        }
        showLoading(true);
        google.script.run
          .withSuccessHandler(function(res){ showLoading(false); resolve(res); })
          .withFailureHandler(function(err){ showLoading(false); reject(err); })
          [fn](payload);
      });
    }

    function toast(msg, type){
      var box = document.getElementById('toast');
      var el = document.createElement('div');
      el.className = 'toast ' + (type || '');
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(function(){ el.style.opacity='0'; el.style.transition='opacity .3s'; }, 2600);
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 3000);
    }

    function rupiah(n){ n = Number(n) || 0; return 'Rp ' + n.toLocaleString('id-ID'); }
    function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function fmtDate(s){ if(!s) return '-'; var d = new Date(s); if (isNaN(d.getTime())) return String(s); return d.toLocaleDateString('id-ID', {day:'2-digit',month:'short',year:'numeric'}); }

    function openModal(title, bodyHtml, onSave){
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = bodyHtml;
      document.getElementById('modal').classList.add('show');
      document.getElementById('modalSave').onclick = onSave;
    }
    function closeModal(){ document.getElementById('modal').classList.remove('show'); }
    function setText(id, txt){ var el=document.getElementById(id); if(el) el.innerHTML = txt; }
    function val(id,v){ var el=document.getElementById(id); if(el) el.value = (v==null?'':v); }
    function getVal(id){ var el=document.getElementById(id); return el?el.value:''; }

    /* ===================== Dropdown Helpers ===================== */
    function akunOptions(selected){
      var items = (STATE.refs.KODE_AKUN || []);
      var html = '<option value="">(pilih akun)</option>';
      items.forEach(function(it){ html += '<option value="'+esc(it.kode)+'"'+(it.kode===selected?' selected':'')+'>'+esc(it.kode)+' - '+esc(it.nama)+'</option>'; });
      return html;
    }
    function kegiatanOptions(selected){
      var items = (STATE.refs.KEGIATAN || []);
      var html = '<option value="">(pilih kegiatan)</option>';
      items.forEach(function(it){ html += '<option value="'+esc(it.kode)+'"'+(it.kode===selected?' selected':'')+'>'+esc(it.kode)+' - '+esc(it.nama)+'</option>'; });
      return html;
    }
    function makPrefixOptions(selected){
      var items = (STATE.refs.MAK_PREFIX || []);
      var html = '<option value="">(pilih prefix)</option>';
      items.forEach(function(it){ html += '<option value="'+esc(it.kode)+'"'+(it.kode===selected?' selected':'')+'>'+esc(it.kode)+' - '+esc(it.nama)+'</option>'; });
      return html;
    }
    function satuanOptions(selected){
      var items = (STATE.refs.SATUAN || []);
      var html = '<option value="">(pilih)</option>';
      items.forEach(function(it){ html += '<option value="'+esc(it)+'"'+(it===selected?' selected':'')+'>'+esc(it)+'</option>'; });
      return html;
    }
    function tahunOptions(selected){
      var items = (STATE.refs.TAHUN || []);
      var html = '<option value="">(pilih tahun)</option>';
      items.forEach(function(it){ html += '<option value="'+it+'"'+(String(it)===String(selected)?' selected':'')+'>'+it+'</option>'; });
      return html;
    }
    function bulanNamaOptions(selected){
      var items = (STATE.refs.BULAN || []);
      var html = '<option value="">(pilih bulan)</option>';
      items.forEach(function(it){ html += '<option value="'+esc(it)+'"'+(it===selected?' selected':'')+'>'+esc(it)+'</option>'; });
      return html;
    }
    function jenjangOptions(selected, firstLabel){
      var items = (STATE.refs.JENJANG || []);
      var html = '<option value="">'+(firstLabel||'(pilih jenjang)')+'</option>';
      items.forEach(function(it){ html += '<option value="'+esc(it)+'"'+(it===selected?' selected':'')+'>'+esc(it)+'</option>'; });
      return html;
    }

    /* ===================== Terbilang ===================== */
    function terbilang(n){
      n = Math.floor(Math.abs(Number(n)||0));
      var sat = ['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
      function w(x){
        if (x < 12) return sat[x];
        if (x < 20) return w(x-10)+' belas';
        if (x < 100) return w(Math.floor(x/10))+' puluh'+(x%10?' '+w(x%10):'');
        if (x < 200) return 'seratus'+(x-100?' '+w(x-100):'');
        if (x < 1000) return w(Math.floor(x/100))+' ratus'+(x%100?' '+w(x%100):'');
        if (x < 2000) return 'seribu'+(x-1000?' '+w(x-1000):'');
        if (x < 1000000) return w(Math.floor(x/1000))+' ribu'+(x%1000?' '+w(x%1000):'');
        if (x < 1000000000) return w(Math.floor(x/1000000))+' juta'+(x%1000000?' '+w(x%1000000):'');
        return w(Math.floor(x/1000000000))+' miliar'+(x%1000000000?' '+w(x%1000000000):'');
      }
      if (n===0) return 'nol';
      var s = w(n);
      while (s.indexOf('  ')>=0) s = s.split('  ').join(' ');
      return s.trim();
    }
    function parseRupiahJS(v){ var s=String(v==null?'':v), o=''; for(var i=0;i<s.length;i++){ var ch=s.charAt(i); if(ch>='0'&&ch<='9') o+=ch; } return parseInt(o,10)||0; }

    /* ===================== Theme System ===================== */
    function applyTheme(uiConfig){
      if (!uiConfig) return;
      var root = document.documentElement;
      if (uiConfig.sidebarColor) root.style.setProperty('--bg', uiConfig.sidebarColor);
      if (uiConfig.brandColor) { root.style.setProperty('--brand', uiConfig.brandColor); root.style.setProperty('--brand-2', uiConfig.brandColor); }
      if (uiConfig.accentColor) root.style.setProperty('--accent', uiConfig.accentColor);
      if (uiConfig.logoUrl) {
        var logoEl = document.getElementById('brandLogo');
        if (logoEl) logoEl.innerHTML = '<img src="'+esc(uiConfig.logoUrl)+'" alt="Logo">';
      }
    }

    /* ===================== Sidebar Navigation ===================== */
    function buildNav(){
      var nav = document.getElementById('nav');
      var isAdmin = STATE.role === 'Admin';
      var items = [
        {page:'dashboard', ico:'&#9632;', label:'Dashboard'},
        {page:'rkkal', ico:'&#43;', label:'Arus Masuk - RKKAL'},
        {page:'rab', ico:'&#9744;', label:'RAB'},
        {page:'rekap', ico:'&#9783;', label:'Arus Keluar - Rekap SPJ'},
        {page:'realisasi', ico:'&#9776;', label:'Realisasi Anggaran'},
        {page:'pajak', ico:'&#37;', label:'Kalkulator Pajak'}
      ];
      if (isAdmin) {
        items.push({page:'export', ico:'&#8595;', label:'Export Laporan'});
      }
      var html = '';
      items.forEach(function(it){
        html += '<button data-page="'+it.page+'"><span class="ico">'+it.ico+'</span> '+it.label+'</button>';
      });
      if (isAdmin) {
        html += '<div class="section-label">Pengaturan</div>';
        var subItems = [
          {page:'pengaturan', label:'Profil Sekolah'},
          {page:'users', label:'Manajemen User'},
          {page:'configAkun', label:'Kode Akun Library'},
          {page:'configKegiatan', label:'Kegiatan Library'},
          {page:'configPrefix', label:'Prefix MAK Library'},
          {page:'configExport', label:'Template Export'},
          {page:'configImport', label:'Template Import'},
          {page:'configTheme', label:'Tema & Tampilan'},
          {page:'setupDb', label:'Setup & Database'},
          {page:'diagnostik', label:'Diagnostik'}
        ];
        html += '<div class="sub-nav">';
        subItems.forEach(function(it){
          html += '<button data-page="'+it.page+'"><span class="ico">&#8227;</span> '+it.label+'</button>';
        });
        html += '</div>';
      }
      nav.innerHTML = html;
      var userInfo = document.getElementById('userInfo');
      userInfo.innerHTML = '<b>'+esc(STATE.userEmail)+'</b><br>Role: '+esc(STATE.role);
    }

    /* ===================== Router ===================== */
    var PAGE_META = {
      dashboard:   { title:'Dashboard', sub:'Ringkasan keuangan sekolah' },
      rkkal:       { title:'Arus Masuk - RKKAL', sub:'Rencana Kerja & Anggaran Kegiatan' },
      rekap:       { title:'Arus Keluar - Rekap SPJ', sub:'Realisasi belanja / kwitansi' },
      realisasi:   { title:'Realisasi Anggaran', sub:'Perbandingan pagu vs realisasi' },
      pajak:       { title:'Kalkulator Pajak', sub:'Hitung PPN & PPh (Pasal 22/23/21)' },
      export:      { title:'Export Laporan', sub:'Unduh laporan dalam format CSV' },
      pengaturan:  { title:'Pengaturan Sekolah', sub:'Profil sekolah' },
      users:       { title:'Manajemen User', sub:'Kelola akses pengguna' },
      configAkun:  { title:'Kode Akun Library', sub:'Kelola daftar kode akun' },
      configKegiatan: { title:'Kegiatan Library', sub:'Kelola daftar kegiatan' },
      configPrefix:{ title:'Prefix MAK Library', sub:'Kelola daftar prefix MAK' },
      configExport:{ title:'Template Export', sub:'Kelola template ekspor data' },
      configImport:{ title:'Template Import', sub:'Kelola template impor data' },
      configTheme: { title:'Tema & Tampilan', sub:'Sesuaikan warna dan logo' },
      rab: { title:'RAB - Rincian Anggaran Biaya', sub:'Buat dan kelola RAB bulanan' },
      setupDb: { title:'Setup & Database', sub:'Kelola database dan backup' },
      diagnostik:  { title:'Diagnostik Sistem', sub:'Informasi teknis dan status' }
    };

    function navigate(page){
      var btns = document.querySelectorAll('#nav button');
      for (var i=0;i<btns.length;i++){
        btns[i].classList.toggle('active', btns[i].getAttribute('data-page') === page);
      }
      var meta = PAGE_META[page] || PAGE_META.dashboard;
      document.getElementById('pageTitle').textContent = meta.title;
      document.getElementById('pageSub').textContent = meta.sub;
      if (page === 'dashboard') renderDashboard();
      else if (page === 'rkkal') renderRKKAL();
      else if (page === 'rekap') renderRekap();
      else if (page === 'realisasi') renderRealisasi();
      else if (page === 'pajak') renderPajak();
      else if (page === 'export') renderExport();
      else if (page === 'pengaturan') renderPengaturan();
      else if (page === 'users') renderUsers();
      else if (page === 'configAkun') renderConfigAkun();
      else if (page === 'configKegiatan') renderConfigKegiatan();
      else if (page === 'configPrefix') renderConfigPrefix();
      else if (page === 'configExport') renderConfigExport();
      else if (page === 'configImport') renderConfigImport();
      else if (page === 'configTheme') renderConfigTheme();
      else if (page === 'rab') renderRAB();
      else if (page === 'setupDb') renderSetupDb();
      else if (page === 'diagnostik') renderDiagnostik();
    }

    /* ===================== Dashboard ===================== */
    function renderDashboard(){
      var c = document.getElementById('content');
      c.innerHTML =
        '<div class="cards">' +
          card('green','Total Pagu','dashPagu','anggaran RKKAL') +
          card('blue','Realisasi','dashRealisasi','arus keluar') +
          card('amber','Sisa Anggaran','dashSisa','pagu - realisasi') +
          card('green','Serapan','dashSerapan','persentase realisasi') +
        '</div>' +
        '<div class="cards" style="margin-top:14px">' +
          card('blue','Jumlah RKKAL','dashRkkal','item anggaran') +
          card('blue','Jumlah Rekap','dashRekap','transaksi keluar') +
          card('green','Terverifikasi','dashVerif','disetujui') +
          card('amber','Pending','dashPending','menunggu') +
        '</div>' +

    function card(color,label,id,pill){

    function loadCharts(){
      gcall('apiGetChartData', { schoolId: STATE.schoolId }).then(function(res){
        if (!res || !res.ok) return;
        if (typeof google === 'undefined' || !google.visualization) return;
        drawPieChart(res.serapanPerKegiatan || []);
        drawBarChart(res.paguVsRealisasi || []);
        drawLineChart(res.trenBulanan || []);
      }).catch(function(err){ console.log('Chart error:', err); });

    function drawPieChart(data){
      var el = document.getElementById('chartPie'); if(!el) return;
      if (!data.length) { el.innerHTML = '<div class="empty">Belum ada data</div>'; return; }
      var dt = new google.visualization.DataTable();
      dt.addColumn('string', 'Kegiatan'); dt.addColumn('number', 'Realisasi');
      data.forEach(function(r){ dt.addRow([r.kegiatan + ' - ' + (r.nama||''), Number(r.realisasi)||0]); });
      var chart = new google.visualization.PieChart(el);
      chart.draw(dt, {pieHole:0.4, height:280, chartArea:{width:'90%',height:'80%'}, legend:{position:'right'}, pieSliceText:'percentage'});
    }
    function drawBarChart(data){
      var el = document.getElementById('chartBar'); if(!el) return;
      if (!data.length) { el.innerHTML = '<div class="empty">Belum ada data</div>'; return; }
      var dt = new google.visualization.DataTable();
      dt.addColumn('string', 'Kode Akun'); dt.addColumn('number', 'Pagu'); dt.addColumn('number', 'Realisasi');
      data.forEach(function(r){ dt.addRow([r.kode + ' ' + (r.nama||''), Number(r.pagu)||0, Number(r.realisasi)||0]); });
      var chart = new google.visualization.ColumnChart(el);
      chart.draw(dt, {height:280, chartArea:{width:'80%',height:'70%'}, legend:{position:'top'}, colors:['#22c55e','#38bdf8']});
    }
    function drawLineChart(data){
      var el = document.getElementById('chartLine'); if(!el) return;
      if (!data.length) { el.innerHTML = '<div class="empty">Belum ada data</div>'; return; }
      var dt = new google.visualization.DataTable();
      dt.addColumn('string', 'Bulan'); dt.addColumn('number', 'Jumlah');
      data.forEach(function(r){ dt.addRow([r.bulan, Number(r.jumlah)||0]); });
      var chart = new google.visualization.AreaChart(el);
      chart.draw(dt, {height:280, chartArea:{width:'85%',height:'70%'}, legend:{position:'none'}, colors:['#38bdf8'], areaOpacity:0.15});
    }

    function wireGenericTabs(tabsId){
      var tabs = document.querySelectorAll('#'+tabsId+' button');
      for (var i=0;i<tabs.length;i++){
        tabs[i].addEventListener('click', function(){
          var name = this.getAttribute('data-tab');
          var allBtns = document.querySelectorAll('#'+tabsId+' button');
          for (var j=0;j<allBtns.length;j++) allBtns[j].classList.toggle('active', allBtns[j]===this);
          var panes = this.closest('.panel').querySelectorAll('[data-pane]');
          for (var k=0;k<panes.length;k++) panes[k].classList.toggle('active', panes[k].getAttribute('data-pane')===name);
        });

    function addRkkalRow(){

    function calcRkkalRow(tr){ var vol = Number(tr.querySelector('.rk-vol').value)||0; var harga = Number(tr.querySelector('.rk-harga').value)||0; tr.querySelector('.rk-jumlah').value = vol*harga; }

    function saveRkkal(){

    var REKAP_ALL = [];

        if (!res||!res.ok) throw new Error((res&&res.error)||'Gagal');
        REKAP_ALL = res.rows || [];
        if (!REKAP_ALL.length){ box.innerHTML = '<div class="empty">Tidak ada data rekap.</div>'; return; }
        var rows = REKAP_ALL.map(function(r){
          var st=(r.status||'pending').toLowerCase();
          var cls = st.indexOf('verif')>-1||st.indexOf('approve')>-1?'verified':(st.indexOf('reject')>-1||st.indexOf('tolak')>-1?'rejected':'pending');

    function renderPajak(){
      var c = document.getElementById('content');

      ['pjNilai','pjMode','pjJenis','pjPpn','pjNpwp'].forEach(function(id){ var el=document.getElementById(id); el.addEventListener('input', hitungPajak); el.addEventListener('change', hitungPajak); });
      hitungPajak();

    function hitungPajak(){
      var nilai = parseRupiahJS(document.getElementById('pjNilai').value);
      var mode = document.getElementById('pjMode').value;
      var jenis = document.getElementById('pjJenis').value;
      var ppnRate = (parseFloat(document.getElementById('pjPpn').value)||0)/100;
      var npwp = document.getElementById('pjNpwp').checked;
      var dpp = mode==='incl' ? Math.round(nilai/(1+ppnRate)) : nilai;
      var ppn = Math.round(dpp*ppnRate);
      var pphRate = 0, pphLabel = 'Tanpa PPh';
      if (jenis==='barang'){ pphRate = npwp?0.015:0.03; pphLabel='PPh Pasal 22 ('+(npwp?'1,5':'3')+'%)'; }
      else if (jenis==='jasa'){ pphRate = npwp?0.02:0.04; pphLabel='PPh Pasal 23 ('+(npwp?'2':'4')+'%)'; }
      else if (jenis==='honor'){ pphRate = npwp?0.05:0.06; pphLabel='PPh Pasal 21 ('+(npwp?'5':'6')+'%)'; }
      var pph = Math.round(dpp*pphRate);
      var bruto = dpp+ppn;
      var dibayar = bruto - pph;
      document.getElementById('pjResult').innerHTML =
        '<table><tr><td>Dasar Pengenaan Pajak (DPP)</td><td class="num">'+rupiah(dpp)+'</td></tr><tr><td>PPN ('+String(ppnRate*100)+'%)</td><td class="num">'+rupiah(ppn)+'</td></tr><tr><td>'+pphLabel+' (dipotong)</td><td class="num">- '+rupiah(pph)+'</td></tr><tr><th>Nilai Bruto (DPP + PPN)</th><th class="num">'+rupiah(bruto)+'</th></tr><tr><th>Dibayar ke rekanan (Bruto - PPh)</th><th class="num">'+rupiah(dibayar)+'</th></tr><tr><th>Disetor ke negara (PPN + PPh)</th><th class="num">'+rupiah(ppn+pph)+'</th></tr></table><div class="hint" style="margin-top:12px">Estimasi. Tarif dapat berbeda sesuai ketentuan terbaru & status NPWP.</div>';
    }

    function addRabRow(){
      rabRowCount++;
      var tr = document.createElement('tr');
      tr.innerHTML = '<td class="muted">'+rabRowCount+'</td><td><select class="rab-akun">'+akunOptions('')+'</select></td><td><input class="rab-uraian" placeholder="Uraian"></td><td><input class="rab-qty" type="number" placeholder="0" style="width:80px"></td><td><select class="rab-sat">'+satuanOptions('')+'</select></td><td><input class="rab-harga" type="number" placeholder="0" style="width:110px"></td><td><input class="rab-jumlah" readonly style="width:110px;background:#f8fafc"></td><td><button class="btn no tiny" title="Hapus">&#10005;</button></td>';
      tr.querySelector('.rab-qty').addEventListener('input', function(){ calcRabRow(tr); });
      tr.querySelector('.rab-harga').addEventListener('input', function(){ calcRabRow(tr); });
      tr.querySelector('button').addEventListener('click', function(){ tr.parentNode.removeChild(tr); renumberRab(); });
      document.getElementById('rabBody').appendChild(tr);
    }
    function calcRabRow(tr){ var qty = Number(tr.querySelector('.rab-qty').value)||0; var harga = Number(tr.querySelector('.rab-harga').value)||0; tr.querySelector('.rab-jumlah').value = qty*harga; }
    function renumberRab(){ var rows = document.querySelectorAll('#rabBody tr'); for(var i=0;i<rows.length;i++) rows[i].cells[0].textContent=(i+1); rabRowCount=rows.length; }
    function saveRAB(){
      var bulan = getVal('rabBulan'); var tahun = getVal('rabTahun'); var jenjang = getVal('rabJenjang'); var namaKegiatan = getVal('rabNamaKegiatan');
      if (!bulan){ toast('Pilih Bulan.', 'err'); return; }
      if (!tahun){ toast('Pilih Tahun.', 'err'); return; }
      if (!namaKegiatan){ toast('Nama Kegiatan wajib diisi.', 'err'); return; }
      var trs = document.querySelectorAll('#rabBody tr'); var items = [];
      for (var i=0;i<trs.length;i++){
        var qty = Number(trs[i].querySelector('.rab-qty').value)||0;
        var harga = Number(trs[i].querySelector('.rab-harga').value)||0;
        items.push({ kodeAkun: trs[i].querySelector('.rab-akun').value, uraian: trs[i].querySelector('.rab-uraian').value, kuantitas: qty, satuan: trs[i].querySelector('.rab-sat').value, hargaSatuan: harga, jumlah: qty*harga });
      }
      var btn = document.getElementById('rabSave'); btn.disabled = true;
      gcall('apiSaveRAB', { schoolId: STATE.schoolId, bulan: bulan, tahun: tahun, jenjang: jenjang, namaKegiatan: namaKegiatan, items: items }).then(function(res){
        btn.disabled = false;
        if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
        toast('RAB berhasil disimpan.', 'ok');
        renderRAB();
      }).catch(function(err){ btn.disabled=false; toast('Gagal: '+err.message, 'err'); });
    }
    function loadRABList(){
      var tahun = getVal('rabListTahun'); var bulan = getVal('rabListBulan');
      var box = document.getElementById('rabListBox');
      box.innerHTML = '<div class="empty">Memuat...</div>';
      gcall('apiGetRABList', { schoolId: STATE.schoolId, tahun: tahun||undefined, bulan: bulan||undefined }).then(function(res){
        if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
        var list = res.list || [];
        if (!list.length){ box.innerHTML = '<div class="empty">Tidak ada data RAB.</div>'; return; }
        var rows = list.map(function(r){
          return '<tr><td>'+esc(r.bulan)+'</td><td>'+esc(r.tahun)+'</td><td>'+esc(r.jenjang)+'</td><td>'+esc(r.namaKegiatan)+'</td><td class="num">'+rupiah(r.total)+'</td><td>'+fmtDate(r.timestamp)+'</td><td style="white-space:nowrap"><button class="btn ghost tiny" onclick="detailRAB(\''+esc(r.id)+'\')">Detail</button> <button class="btn ghost tiny" onclick="exportRAB(\''+esc(r.id)+'\')">Export</button> <button class="btn no tiny" onclick="deleteRAB(\''+esc(r.id)+'\')">Hapus</button></td></tr>';
        }).join('');
        box.innerHTML = '<div style="overflow-x:auto"><table><thead><tr><th>Bulan</th><th>Tahun</th><th>Jenjang</th><th>Nama Kegiatan</th><th class="num">Total</th><th>Timestamp</th><th>Aksi</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
      }).catch(function(err){ box.innerHTML = '<div class="empty">Gagal: '+esc(err.message)+'</div>'; });
    }
    function detailRAB(id){
      gcall('apiGetRAB', { id: id }).then(function(res){
        if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
        var items = res.items || [];
        var html = '<table><thead><tr><th>Kode Akun</th><th>Uraian</th><th class="num">Kuantitas</th><th>Satuan</th><th class="num">Harga Satuan</th><th class="num">Jumlah</th></tr></thead><tbody>';
        var total = 0;
        items.forEach(function(it){
          total += Number(it.jumlah)||0;
          html += '<tr><td class="mono">'+esc(it.kodeAkun)+'</td><td>'+esc(it.uraian)+'</td><td class="num">'+(it.kuantitas||0)+'</td><td>'+esc(it.satuan)+'</td><td class="num">'+rupiah(it.hargaSatuan)+'</td><td class="num">'+rupiah(it.jumlah)+'</td></tr>';
        });
        html += '</tbody><tfoot><tr><th colspan="5" class="right">TOTAL</th><th class="num">'+rupiah(total)+'</th></tr></tfoot></table>';
        openModal('Detail RAB', html, function(){ closeModal(); });
      }).catch(function(err){ toast('Gagal: '+err.message, 'err'); });
    }
    function deleteRAB(id){
      if (!confirm('Hapus dokumen RAB ini?')) return;
      gcall('apiDeleteRAB', { id: id }).then(function(res){
        if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
        toast('RAB dihapus.', 'ok'); loadRABList();
      }).catch(function(err){ toast('Gagal: '+err.message, 'err'); });
    }
    function exportRAB(id){
      gcall('apiExportRAB', { id: id }).then(function(res){
        if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
        if (res.content){ downloadCsv(res.filename||'rab_export.csv', res.content); toast('RAB diekspor.','ok'); } else { toast('Tidak ada data.','err'); }
      }).catch(function(err){ toast('Gagal: '+err.message, 'err'); });
    }

    /* ===================== Setup & Database ===================== */
    function renderSetupDb(){
      var c = document.getElementById('content');
      c.innerHTML =
        '<div class="panel"><h2>Database Health</h2><p class="desc">Status kesehatan database (sheet).</p><div id="dbHealthBox"><div class="empty">Memuat...</div></div><div class="row-actions"><button class="btn primary" id="dbRepairBtn">Repair Database</button></div></div>' +
        '<div class="panel"><h2>Backup Database</h2><p class="desc">Buat dan kelola backup spreadsheet.</p><div class="row-actions"><button class="btn primary" id="dbBackupBtn">Buat Backup Sekarang</button><button class="btn ghost" id="dbDailyOnBtn">Aktifkan Backup Harian</button><button class="btn ghost" id="dbDailyOffBtn">Nonaktifkan Backup Harian</button></div></div>' +
        '<div class="panel"><h2>Daftar Backup</h2><p class="desc">Backup yang tersedia untuk restore.</p><div id="dbBackupList"><div class="empty">Memuat...</div></div></div>';
      loadDbHealth();
      loadBackupList();
      document.getElementById('dbRepairBtn').addEventListener('click', function(){
        var btn=this; btn.disabled=true;
        gcall('apiSetupDatabase', null).then(function(res){ btn.disabled=false; if(!res||!res.ok) throw new Error((res&&res.error)||'Gagal'); toast('Database diperbaiki.','ok'); loadDbHealth(); }).catch(function(err){ btn.disabled=false; toast('Gagal: '+err.message,'err'); });
      });
      document.getElementById('dbBackupBtn').addEventListener('click', function(){
        var btn=this; btn.disabled=true;
        gcall('apiCreateBackup', null).then(function(res){ btn.disabled=false; if(!res||!res.ok) throw new Error((res&&res.error)||'Gagal'); toast('Backup berhasil dibuat: '+(res.backupName||''),'ok'); loadBackupList(); }).catch(function(err){ btn.disabled=false; toast('Gagal: '+err.message,'err'); });
      });
      document.getElementById('dbDailyOnBtn').addEventListener('click', function(){
        var btn=this; btn.disabled=true;
        gcall('apiSetupDailyBackup', null).then(function(res){ btn.disabled=false; if(!res||!res.ok) throw new Error((res&&res.error)||'Gagal'); toast('Backup harian diaktifkan.','ok'); }).catch(function(err){ btn.disabled=false; toast('Gagal: '+err.message,'err'); });
      });
      document.getElementById('dbDailyOffBtn').addEventListener('click', function(){
        var btn=this; btn.disabled=true;
        gcall('apiRemoveDailyBackup', null).then(function(res){ btn.disabled=false; if(!res||!res.ok) throw new Error((res&&res.error)||'Gagal'); toast('Backup harian dinonaktifkan.','ok'); }).catch(function(err){ btn.disabled=false; toast('Gagal: '+err.message,'err'); });
      });
    }
    function loadDbHealth(){
      var box = document.getElementById('dbHealthBox'); box.innerHTML = '<div class="empty">Memuat...</div>';
      gcall('apiCheckDatabaseHealth', null).then(function(res){
        if (!res||!res.ok) throw new Error((res&&res.error)||'Gagal');
        var sheets = res.sheets || [];
        if (!sheets.length){ box.innerHTML = '<div class="empty">Tidak ada info.</div>'; return; }
        var rows = sheets.map(function(s){
          var statusCls = s.exists ? 'verified' : 'rejected';
          var statusLabel = s.exists ? 'OK' : 'Missing';
          var colCls = s.columnsMatch ? 'verified' : 'rejected';
          var colLabel = s.columnsMatch ? 'OK' : 'Mismatch';
          return '<tr><td>'+esc(s.name)+'</td><td><span class="badge '+statusCls+'">'+statusLabel+'</span></td><td class="num">'+(s.rows||0)+'</td><td><span class="badge '+colCls+'">'+colLabel+'</span></td></tr>';
        }).join('');
        box.innerHTML = '<table><thead><tr><th>Sheet Name</th><th>Status</th><th class="num">Rows</th><th>Columns</th></tr></thead><tbody>'+rows+'</tbody></table>';
      }).catch(function(err){ box.innerHTML = '<div class="empty">Gagal: '+esc(err.message)+'</div>'; });
    }
    function loadBackupList(){
      var box = document.getElementById('dbBackupList'); box.innerHTML = '<div class="empty">Memuat...</div>';
      gcall('apiListBackups', null).then(function(res){
        if (!res||!res.ok) throw new Error((res&&res.error)||'Gagal');
        var backups = res.backups || [];
        if (!backups.length){ box.innerHTML = '<div class="empty">Belum ada backup.</div>'; return; }
        var rows = backups.map(function(b){
          return '<tr><td>'+esc(b.name)+'</td><td>'+fmtDate(b.date)+'</td><td><a href="'+esc(b.url)+'" target="_blank" class="btn ghost tiny">Buka</a></td><td><button class="btn ghost tiny" onclick="restoreBackup(\''+esc(b.id)+'\',\''+esc(b.name)+'\')">Restore</button></td></tr>';
        }).join('');
        box.innerHTML = '<table><thead><tr><th>Nama</th><th>Tanggal</th><th>Link</th><th>Aksi</th></tr></thead><tbody>'+rows+'</tbody></table>';
      }).catch(function(err){ box.innerHTML = '<div class="empty">Gagal: '+esc(err.message)+'</div>'; });
    }
    function restoreBackup(backupId, backupName){
      if (!confirm('Restore dari backup "'+backupName+'"? Data saat ini akan ditimpa.')) return;
      gcall('apiRestoreBackup', { backupId: backupId }).then(function(res){
        if (!res||!res.ok) throw new Error((res&&res.error)||'Gagal');
        toast('Restore berhasil.','ok'); loadDbHealth();
      }).catch(function(err){ toast('Gagal: '+err.message,'err'); });
    }

    /* ===================== Boot ===================== */
    function boot(){
      google.charts.load('current', {packages:['corechart']});
      gcall('apiGetCurrentUser', null).then(function(userRes){
        if (!userRes || !userRes.ok){ showAccessDenied(''); return; }
        var role = userRes.role;
        var email = userRes.email || '';
        if (!role || role === 'Guest'){ showAccessDenied(email); return; }
        STATE.role = role;
        STATE.userEmail = email;
        runBootstrap();
      }).catch(function(err){
        showAccessDenied('');
      });
    }
    function runBootstrap(){
      gcall('apiBootstrap', null).then(function(res){
        if (!res || !res.ok) throw new Error((res && res.error) || 'Bootstrap gagal');
        STATE.schoolId = res.schoolId;
        STATE.refs = res.refs || {};
        STATE.schoolName = (res.schools && res.schools[0] && res.schools[0].nama) || 'Sekolah Rakyat';
        document.getElementById('schoolName').textContent = STATE.schoolName;
        document.getElementById('schoolId').textContent = res.schoolId || '';
        if (res.spreadsheetUrl){
          var link = document.getElementById('sheetLink');
          link.href = res.spreadsheetUrl;
          link.style.display = 'block';
        }
        if (res.uiConfig) applyTheme(res.uiConfig);
        buildNav();
        document.getElementById('appRoot').style.display = 'flex';
        navigate('dashboard');
      }).catch(function(err){
        document.getElementById('schoolName').textContent = 'Gagal terhubung';
        buildNav();
        document.getElementById('appRoot').style.display = 'flex';
        toast('Bootstrap: ' + err.message, 'err');
        navigate('dashboard');
      });
    }
    function showAccessDenied(email){
      var el = document.getElementById('accessDenied');
      el.style.display = 'block';
      el.innerHTML = '<div class="access-denied"><h1>Akses Ditolak</h1><p>Hubungi Admin untuk mendapatkan akses ke aplikasi ini.</p>' + (email ? '<div class="email">'+esc(email)+'</div>' : '') + '</div>';
    }

    // Wire nav + refresh
    document.getElementById('nav').addEventListener('click', function(e){
      var btn = e.target.closest ? e.target.closest('button[data-page]') : null;
      if (!btn){ var t=e.target; while(t && t!==this){ if(t.getAttribute && t.getAttribute('data-page')){btn=t;break;} t=t.parentNode; } }
      if (btn) navigate(btn.getAttribute('data-page'));
    });
    document.getElementById('refreshBtn').addEventListener('click', function(){
      var active = document.querySelector('#nav button.active');
      navigate(active ? active.getAttribute('data-page') : 'dashboard');
    });

    boot();
  </script>
</body>
</html>
