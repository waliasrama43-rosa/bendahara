<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>ERP Keuangan Sekolah Rakyat</title>
  <style>
    :root{
      --bg:#0f172a; --panel:#111827; --card:#1e293b; --line:#334155;
      --txt:#e2e8f0; --muted:#94a3b8; --brand:#22c55e; --brand-2:#16a34a;
      --accent:#38bdf8; --warn:#f59e0b; --danger:#ef4444; --ok:#22c55e;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{
      font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
      background:#f1f5f9;color:#0f172a;font-size:14px;
    }
    /* Layout */
    .app{display:flex;min-height:100vh}
    .sidebar{
      width:248px;background:linear-gradient(180deg,#0f172a,#111827);
      color:#e2e8f0;padding:18px 14px;flex-shrink:0;
    }
    .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
    .brand .logo{
      width:38px;height:38px;border-radius:10px;flex-shrink:0;
      background:linear-gradient(135deg,var(--brand),var(--accent));
      display:flex;align-items:center;justify-content:center;font-weight:800;color:#04210f;
    }
    .brand b{font-size:15px;line-height:1.1}
    .brand small{color:var(--muted);font-size:11px}
    .nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
    .nav button{
      display:flex;align-items:center;gap:10px;width:100%;text-align:left;
      background:transparent;border:0;color:#cbd5e1;padding:10px 12px;border-radius:10px;
      cursor:pointer;font-size:13.5px;transition:.15s;
    }
    .nav button:hover{background:#1f2937;color:#fff}
    .nav button.active{background:linear-gradient(90deg,var(--brand-2),#0e7a37);color:#fff;font-weight:600}
    .nav .ico{width:18px;text-align:center}
    .sidebar .school{
      margin-top:18px;padding:12px;border:1px solid #1f2937;border-radius:10px;
      background:#0b1220;font-size:12px;color:var(--muted)
    }
    .sidebar .school b{color:#e2e8f0;display:block;font-size:13px;margin-top:2px}

    .main{flex:1;display:flex;flex-direction:column;min-width:0}
    .topbar{
      background:#fff;border-bottom:1px solid #e2e8f0;padding:14px 22px;
      display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:5
    }
    .topbar h1{font-size:17px;margin:0}
    .topbar .sub{color:#64748b;font-size:12px;margin-top:2px}
    .content{padding:22px;max-width:1100px;width:100%}

    /* Cards */
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .stat{
      background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;
      box-shadow:0 1px 2px rgba(15,23,42,.04)
    }
    .stat .label{color:#64748b;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
    .stat .value{font-size:26px;font-weight:800;margin-top:8px;color:#0f172a}
    .stat .value.small{font-size:20px}
    .stat .pill{display:inline-block;margin-top:8px;font-size:11px;padding:3px 8px;border-radius:999px}
    .stat.green{border-top:3px solid var(--brand)}
    .stat.blue{border-top:3px solid var(--accent)}
    .stat.amber{border-top:3px solid var(--warn)}
    .stat.red{border-top:3px solid var(--danger)}
    .pill.green{background:#dcfce7;color:#166534}
    .pill.amber{background:#fef3c7;color:#92400e}
    .pill.blue{background:#e0f2fe;color:#075985}

    .panel{
      background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin-top:18px;
      box-shadow:0 1px 2px rgba(15,23,42,.04)
    }
    .panel h2{font-size:15px;margin:0 0 4px}
    .panel .desc{color:#64748b;font-size:12.5px;margin:0 0 14px}

    /* Tabs */
    .tabs{display:flex;gap:6px;border-bottom:1px solid #e2e8f0;margin-bottom:16px;flex-wrap:wrap}
    .tabs button{
      background:transparent;border:0;border-bottom:2px solid transparent;
      padding:10px 14px;cursor:pointer;color:#64748b;font-size:13.5px;font-weight:600
    }
    .tabs button.active{color:var(--brand-2);border-bottom-color:var(--brand-2)}
    .tabpane{display:none}
    .tabpane.active{display:block}

    /* Tables */
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:9px 10px;text-align:left;border-bottom:1px solid #eef2f7;vertical-align:middle}
    th{color:#64748b;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;background:#f8fafc}
    td input{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:8px;font-size:13px}
    td input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
    .right{text-align:right}
    .num{text-align:right;font-variant-numeric:tabular-nums}

    /* Buttons */
    .btn{
      border:0;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;
      display:inline-flex;align-items:center;gap:7px
    }
    .btn.primary{background:var(--brand-2);color:#fff}
    .btn.primary:hover{background:#0e7a37}
    .btn.ghost{background:#f1f5f9;color:#334155}
    .btn.ghost:hover{background:#e2e8f0}
    .btn.tiny{padding:5px 10px;font-size:12px;border-radius:8px}
    .btn.ok{background:#dcfce7;color:#166534}
    .btn.no{background:#fee2e2;color:#991b1b}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .row-actions{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap}

    .field{margin-bottom:12px}
    .field label{display:block;font-size:12.5px;color:#475569;margin-bottom:5px;font-weight:600}
    .field input,.field select,.field textarea{
      width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font-size:13.5px;font-family:inherit
    }
    .field textarea{min-height:150px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

    .badge{padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
    .badge.pending{background:#fef3c7;color:#92400e}
    .badge.verified{background:#dcfce7;color:#166534}
    .badge.rejected{background:#fee2e2;color:#991b1b}

    .empty{text-align:center;color:#94a3b8;padding:26px 10px;font-size:13px}
    .muted{color:#64748b}
    .mono{font-family:ui-monospace,Consolas,monospace}
    .hint{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:12px;color:#475569;font-size:12.5px}

    /* Toast */
    #toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50}
    .toast{
      background:#0f172a;color:#fff;padding:11px 15px;border-radius:10px;font-size:13px;
      box-shadow:0 10px 25px rgba(0,0,0,.25);min-width:220px;max-width:340px;animation:slideIn .2s ease
    }
    .toast.ok{background:#166534}
    .toast.err{background:#991b1b}
    @keyframes slideIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
    .modal-overlay.show{display:flex}
    .modal{background:#fff;border-radius:14px;padding:20px;width:430px;max-width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:slideIn .15s ease}
    .modal h3{margin:0 0 14px;font-size:16px}

    /* Login */
    #login{position:fixed;inset:0;background:linear-gradient(135deg,#0f172a,#1e293b);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
    #login.show{display:flex}
    .loginbox{background:#fff;border-radius:16px;padding:28px;width:360px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
    .loginbox h2{font-size:18px;margin:14px 0 2px}
    .loginbox .field{text-align:left}
    .llogo{width:48px;height:48px;border-radius:12px;margin:0 auto;background:linear-gradient(135deg,var(--brand),var(--accent));display:flex;align-items:center;justify-content:center;font-weight:800;color:#04210f;font-size:18px}
    .rolebadge{font-size:11px;padding:3px 9px;border-radius:999px;background:#e0f2fe;color:#075985;font-weight:600}

    /* Loading bar */
    #loading{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;transition:width .3s;z-index:60}

    @media (max-width:820px){
      .app{flex-direction:column}
      .sidebar{width:100%}
      .nav{flex-direction:row;flex-wrap:wrap}
      .cards{grid-template-columns:repeat(2,1fr)}
      .grid2{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div id="loading"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">SR</div>
        <div>
          <b>ERP Keuangan</b>
          <small>Sekolah Rakyat</small>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button data-page="dashboard" class="active"><span class="ico">&#9632;</span> Dashboard</button>
        <button data-page="rkkal"><span class="ico">&#43;</span> Input / Upload RKKAL</button>
        <button data-page="pagu"><span class="ico">&#9745;</span> Pagu / RKKAL</button>
        <button data-page="rab"><span class="ico">&#9776;</span> RAB Bulanan</button>
        <button data-page="transaksi"><span class="ico">&#9783;</span> Lihat Transaksi</button>
        <button data-page="realisasi"><span class="ico">&#931;</span> Realisasi Anggaran</button>
        <button data-page="pajak"><span class="ico">&#37;</span> Kalkulator Pajak</button>
        <button data-page="export"><span class="ico">&#8595;</span> Export Laporan</button>
        <button data-page="pengaturan"><span class="ico">&#9881;</span> Pengaturan Sekolah</button>
      </nav>
      <div class="school">
        Sekolah Aktif
        <b id="schoolName">Memuat...</b>
        <span class="mono" id="schoolId"></span>
        <a id="sheetLink" href="#" target="_blank" style="display:none;color:#7dd3fc;font-size:11.5px;margin-top:8px;display:none">&#128203; Buka Spreadsheet (verifikasi data)</a>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <div class="sub" id="pageSub">Ringkasan keuangan sekolah</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span id="userBadge" class="rolebadge" style="display:none"></span>
          <button class="btn ghost" id="refreshBtn">&#8635; Muat Ulang</button>
          <button class="btn ghost" id="logoutBtn" style="display:none">Keluar</button>
        </div>
      </header>
      <main class="content" id="content"><!-- pages injected here --></main>
    </div>
  </div>
  <div id="toast"></div>

  <div id="modal" class="modal-overlay">
    <div class="modal">
      <h3 id="modalTitle">Edit</h3>
      <div id="modalBody"></div>
      <div class="row-actions" style="justify-content:flex-end;margin-top:8px">
        <button class="btn ghost" type="button" onclick="closeModal()">Batal</button>
        <button class="btn primary" type="button" id="modalSave">Simpan</button>
      </div>
    </div>
  </div>

  <div id="login" class="modal-overlay"></div>

  <script>
    /* ===================== Helpers ===================== */
    var STATE = { schoolId: null, schoolName: '', token: '', role: '', userName: '' };
    var loadingCount = 0;

    function showLoading(on){
      loadingCount += on ? 1 : -1;
      if (loadingCount < 0) loadingCount = 0;
      var bar = document.getElementById('loading');
      bar.style.width = loadingCount > 0 ? '85%' : '0';
      if (loadingCount === 0) setTimeout(function(){ bar.style.width='0'; }, 120);
    }

    // Promise wrapper around google.script.run
    function gcall(fn, payload){
      if (STATE.token && fn !== 'apiLogin'){ payload = payload || {}; if (typeof payload === 'object') payload.token = STATE.token; }
      return new Promise(function(resolve, reject){
        if (typeof google === 'undefined' || !google.script || !google.script.run){
          reject(new Error('google.script.run tidak tersedia (jalankan via Web App Apps Script).'));
          return;
        }
        showLoading(true);
        google.script.run
          .withSuccessHandler(function(res){ showLoading(false); resolve(res); })
          .withFailureHandler(function(err){ showLoading(false); reject(err); })
          [fn](payload);
      });
    }

    function toast(msg, type){
      var box = document.getElementById('toast');
      var el = document.createElement('div');
      el.className = 'toast ' + (type || '');
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(function(){ el.style.opacity='0'; el.style.transition='opacity .3s'; }, 2600);
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 3000);
    }

    function rupiah(n){
      n = Number(n) || 0;
      return 'Rp ' + n.toLocaleString('id-ID');
    }
    function esc(s){
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
    }
    function fmtDate(s){
      if(!s) return '-';
      var d = new Date(s);
      if (isNaN(d.getTime())) return String(s);
      return d.toLocaleDateString('id-ID', {day:'2-digit',month:'short',year:'numeric'});
    }

    /* Bulan & Jenjang helpers */
    var MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    var JENJANG_LIST = ['SD','SMP','SMA/SMK'];
    function bulanLabel(val){
      if(!val) return '-';
      var p = String(val).split('-'); var y = parseInt(p[0],10); var m = parseInt(p[1],10);
      if (!(m>=1 && m<=12)) return String(val);
      return MONTHS[m-1] + ' ' + y;
    }
    function monthOptions(sel){
      var now = new Date(); var cy = now.getFullYear();
      var cur = sel || (cy + '-' + (now.getMonth()+1));
      var vals = [];
      for (var y = cy-2; y <= cy+1; y++){ for (var m=1;m<=12;m++){ vals.push(y+'-'+m); } }
      // Pastikan nilai tersimpan selalu tampil (hindari fallback ke opsi pertama).
      if (cur && vals.indexOf(cur) === -1) vals.unshift(cur);
      var html = '';
      for (var i=0;i<vals.length;i++){
        var v = vals[i];
        html += '<option value="'+v+'"'+(v===cur?' selected':'')+'>'+bulanLabel(v)+'</option>';
      }
      return html;
    }
    // Daftar periode unik (YYYY-M) yang BENAR-BENAR ada di data, urut terbaru dulu.
    function cmpPeriod(a,b){ var pa=String(a).split('-'),pb=String(b).split('-'); return ((+pa[0])-(+pb[0]))||((+pa[1])-(+pb[1])); }
    function distinctPeriods(){
      var set = {};
      TRX_ALL.forEach(function(t){ var p = t.bulan ? String(t.bulan) : trxPeriodOf(t.timestamp); if(p) set[p]=true; });
      var arr = Object.keys(set);
      arr.sort(function(a,b){ return cmpPeriod(b,a); });
      return arr;
    }
    function periodFilterOptions(){
      var html = '<option value="*">Semua Periode</option>';
      distinctPeriods().forEach(function(p){ html += '<option value="'+p+'">'+bulanLabel(p)+'</option>'; });
      return html;
    }
    function jenjangOptions(sel, firstLabel){
      var html = '<option value="">'+(firstLabel||'(pilih jenjang)')+'</option>';
      JENJANG_LIST.forEach(function(j){ html += '<option value="'+j+'"'+(j===sel?' selected':'')+'>'+j+'</option>'; });
      return html;
    }

    var PAGE_META = {
      dashboard:  { title:'Dashboard', sub:'Ringkasan keuangan sekolah' },
      rkkal:      { title:'Input / Upload RKKAL', sub:'Masukkan rencana anggaran secara manual atau unggah file' },
      rab:        { title:'RAB Bulanan', sub:'Rekap anggaran per kode anggaran tiap bulan' },
      transaksi:  { title:'Lihat Transaksi', sub:'Daftar seluruh transaksi & verifikasi' },
      pagu:       { title:'Pagu / RKKAL', sub:'Pagu anggaran setahun (acuan) per kode akun' },
      realisasi:  { title:'Realisasi Anggaran', sub:'Pagu vs Realisasi vs Saldo per kode akun' },
      export:     { title:'Export Laporan', sub:'Unduh laporan SPJ dalam format Excel' },
      pajak:      { title:'Kalkulator Pajak', sub:'Hitung PPN & PPh (Pasal 22/23/21)' },
      pengaturan: { title:'Pengaturan Sekolah', sub:'Profil & identitas sekolah' }
    };

    /* ===================== Router ===================== */
    function navigate(page){
      var btns = document.querySelectorAll('#nav button');
      for (var i=0;i<btns.length;i++){
        btns[i].classList.toggle('active', btns[i].getAttribute('data-page') === page);
      }
      var meta = PAGE_META[page] || PAGE_META.dashboard;
      document.getElementById('pageTitle').textContent = meta.title;
      document.getElementById('pageSub').textContent = meta.sub;

      if (page === 'dashboard') renderDashboard();
      else if (page === 'rkkal') renderRKKAL();
      else if (page === 'rab') renderRAB();
      else if (page === 'transaksi') renderTransaksi();
      else if (page === 'pagu') renderPagu();
      else if (page === 'realisasi') renderRealisasi();
      else if (page === 'pajak') renderPajak();
      else if (page === 'export') renderExport();
      else if (page === 'pengaturan') renderPengaturan();
    }

    /* ===================== Dashboard ===================== */
    function renderDashboard(){
      var c = document.getElementById('content');
      c.innerHTML =
        '<div class="cards">' +
          card('green','Total Transaksi','dashTotal','&#8226; semua periode','blue') +
          card('blue','Total Anggaran','dashAnggaran','&#8226; akumulasi','blue', true) +
          card('green','Terverifikasi','dashVerified','sudah disetujui','green') +
          card('amber','Menunggu Verifikasi','dashPending','perlu ditinjau','amber') +
        '</div>' +
        '<div class="panel">' +
          '<h2>Rekap Anggaran per Jenjang</h2>' +
          '<div id="jenjangBox"><div class="empty">Memuat...</div></div>' +
        '</div>' +
        '<div class="panel">' +
          '<h2>Selamat datang &#128075;</h2>' +
          '<p class="desc">Gunakan menu <b>Input / Upload RKKAL</b> untuk menambah data anggaran, lalu pantau ringkasannya di sini.</p>' +
          '<div class="row-actions">' +
            '<button class="btn primary" onclick="navigate(\'rkkal\')">&#43; Tambah Anggaran</button>' +
            '<button class="btn ghost" onclick="navigate(\'transaksi\')">Lihat Transaksi</button>' +
          '</div>' +
        '</div>';

      gcall('apiGetDashboard', { schoolId: STATE.schoolId }).then(function(res){
        if (!res || !res.ok){ throw new Error((res && res.error) || 'Gagal memuat data'); }
        var s = res.stats || {};
        setText('dashTotal', String(s.totalTransaksi || 0));
        setText('dashAnggaran', rupiah(s.totalAnggaran || 0));
        setText('dashVerified', String(s.terverifikasi || 0));
        setText('dashPending', String(s.pending || 0));
        renderJenjangBox(res.perJenjang || []);
      }).catch(function(err){
        toast('Dashboard: ' + err.message, 'err');
        // Show 0 instead of "—" so the cards still read as numbers.
        setText('dashTotal','0'); setText('dashAnggaran', rupiah(0));
        setText('dashVerified','0'); setText('dashPending','0');
        var jb = document.getElementById('jenjangBox'); if (jb) jb.innerHTML = '<div class="empty">-</div>';
      });
    }
    function card(color,label,id,pill,pillColor,small){
      return '<div class="stat '+color+'">' +
        '<div class="label">'+label+'</div>' +
        '<div class="value'+(small?' small':'')+'" id="'+id+'">&#8943;</div>' +
        '<span class="pill '+(pillColor||'blue')+'">'+pill+'</span>' +
      '</div>';
    }
    function setText(id, txt){ var el=document.getElementById(id); if(el) el.innerHTML = txt; }
    function renderJenjangBox(pj){
      var box = document.getElementById('jenjangBox'); if (!box) return;
      var rows = '', gt = 0, gc = 0;
      pj.forEach(function(r){
        if (r.count===0 && r.jenjang==='(lainnya)') return;
        gt += r.total; gc += r.count;
        rows += '<tr><td>'+esc(r.jenjang)+'</td><td class="num">'+r.count+'</td><td class="num">'+rupiah(r.total)+'</td></tr>';
      });
      if (!rows){ box.innerHTML = '<div class="empty">Belum ada data. Tambahkan transaksi dengan jenjang.</div>'; return; }
      box.innerHTML = '<table><thead><tr><th>Jenjang</th><th class="num">Transaksi</th><th class="num">Total Anggaran</th></tr></thead>' +
        '<tbody>'+rows+'</tbody>' +
        '<tfoot><tr><th>Total</th><th class="num">'+gc+'</th><th class="num">'+rupiah(gt)+'</th></tr></tfoot></table>';
    }

    /* ===================== Input / Upload RKKAL ===================== */
    function renderRKKAL(){
      var c = document.getElementById('content');
      c.innerHTML =
        '<div class="panel">' +
          '<div class="tabs" id="rkkalTabs">' +
            '<button data-tab="manual" class="active">&#9998; Input Manual</button>' +
            '<button data-tab="upload">&#8593; Upload File (CSV)</button>' +
            '<button data-tab="template">&#9783; Template RKKAL</button>' +
          '</div>' +

          '<div class="tabpane active" data-pane="manual">' +
            '<h2>Input Manual</h2>' +
            '<p class="desc">Pilih <b>Bulan</b> & <b>Jenjang</b>, isi kolom, lalu klik <b>Simpan Semua</b>. Baris kosong diabaikan.</p>' +
            '<div class="grid2">' +
              '<div class="field"><label>Bulan</label><select id="manualBulan">'+monthOptions()+'</select></div>' +
              '<div class="field"><label>Jenjang</label><select id="manualJenjang">'+jenjangOptions('','(pilih jenjang)')+'</select></div>' +
            '</div>' +
            '<div style="overflow-x:auto"><table style="min-width:820px">' +
              '<thead><tr>' +
                '<th style="width:30px">#</th>' +
                '<th>Kode Akun (MAK)</th>' +
                '<th>Uraian Pembayaran</th>' +

    /* ===================== Kwitansi & Bukti ===================== */
    function terbilang(n){
      n = Math.floor(Math.abs(Number(n)||0));
      var sat = ['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
      function w(x){
        if (x < 12) return sat[x];
        if (x < 20) return w(x-10)+' belas';
        if (x < 100) return w(Math.floor(x/10))+' puluh'+(x%10? ' '+w(x%10):'');
        if (x < 200) return 'seratus'+(x-100? ' '+w(x-100):'');
        if (x < 1000) return w(Math.floor(x/100))+' ratus'+(x%100? ' '+w(x%100):'');
        if (x < 2000) return 'seribu'+(x-1000? ' '+w(x-1000):'');
        if (x < 1000000) return w(Math.floor(x/1000))+' ribu'+(x%1000? ' '+w(x%1000):'');
        if (x < 1000000000) return w(Math.floor(x/1000000))+' juta'+(x%1000000? ' '+w(x%1000000):'');
        return w(Math.floor(x/1000000000))+' miliar'+(x%1000000000? ' '+w(x%1000000000):'');
      }
      if (n===0) return 'nol';
      var s = w(n);
      while (s.indexOf('  ')>=0) s = s.split('  ').join(' ');
      return s.trim();
    }

      var no = 'KW/'+String(t.id||'').slice(-6)+'/'+(t.bulan||'');
      var html = '<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Kwitansi</title>' +
        '<style>body{font-family:Arial,sans-serif;padding:30px;color:#111}.kw{max-width:640px;margin:auto;border:2px solid #111;padding:24px;border-radius:8px}' +

    function renderBuktiModal(id){
      var t = findTrx(id); if(!t) return;
      var list = t.bukti || [];
      var body = '';
      if (!list.length) body += '<p class="muted">Belum ada bukti untuk transaksi ini.</p>';
      else {
        body += '<table><tbody>';
        list.forEach(function(b,i){
          body += '<tr><td>'+esc(b.name||('Bukti '+(i+1)))+'</td>' +
            '<td><a href="'+esc(b.url)+'" target="_blank">Lihat</a></td>' +
            '<td style="text-align:right"><button class="btn no tiny" onclick="hapusBukti(\''+id+'\','+i+')">Hapus</button></td></tr>';
        });
        body += '</tbody></table>';
      }
      body += '<div class="row-actions"><button class="btn primary" onclick="tambahBukti(\''+id+'\')">&#43; Tambah Bukti</button></div>' +
        '<div class="hint" style="margin-top:10px">Satu transaksi boleh punya banyak bukti (mis. nota, faktur, foto). Maks 5 MB/berkas.</div>';
      openModal('Bukti Transaksi ('+list.length+')', body, closeModal, 'Tutup');

    function refreshTrx(cb){
      gcall('apiGetTransactions', { schoolId: STATE.schoolId }).then(function(res){
        if (res && res.ok){ TRX_ALL = res.rows||[]; renderTrxTable(); }
        if (cb) cb();

    }
    function tambahBukti(id){
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*,application/pdf';
      input.onchange = function(){
        var f = input.files[0]; if(!f) return;
        if (f.size > 5*1024*1024){ toast('Ukuran file maksimal 5 MB.', 'err'); return; }
        var reader = new FileReader();
        reader.onload = function(ev){
          var base64 = String(ev.target.result).split(',')[1] || '';
          toast('Mengunggah bukti...');
          gcall('apiUploadBukti', { id:id, filename:f.name, mimeType:f.type, dataBase64:base64 }).then(function(res){
            if (!res || !res.ok) throw new Error((res&&res.error)||'Gagal');
            toast('Bukti berhasil diunggah.', 'ok');
            refreshTrx(function(){ renderBuktiModal(id); });
          }).catch(function(err){ toast('Gagal: '+err.message, 'err'); });
        };
        reader.readAsDataURL(f);
      };
      input.click();
    }
    function hapusBukti(id, idx){
      if (!confirm('Hapus bukti ini dari daftar transaksi?')) return;
      gcall('apiDeleteBukti', { id:id, index:idx }).then(function(res){
        if (!res || !res.ok) throw new Error((res&&res.error)||'Gagal');
        toast('Bukti dihapus.', 'ok');
        refreshTrx(function(){ renderBuktiModal(id); });
      }).catch(function(err){ toast('Gagal: '+err.message, 'err'); });
    }

    /* ===================== Kalkulator Pajak ===================== */
    function parseRupiahJS(v){ var s=String(v==null?'':v), o=''; for(var i=0;i<s.length;i++){ var ch=s.charAt(i); if(ch>='0'&&ch<='9') o+=ch; } return parseInt(o,10)||0; }
    function renderPajak(){
      var c = document.getElementById('content');
      c.innerHTML =
        '<div class="panel">' +
          '<h2>Kalkulator Pajak Belanja</h2>' +
          '<p class="desc">Hitung PPN & PPh untuk belanja barang/jasa/honor. Default PPN 11%.</p>' +
          '<div class="grid2">' +
            '<div class="field"><label>Nilai (Rp)</label><input id="pjNilai" class="num" inputmode="numeric" placeholder="0"></div>' +
            '<div class="field"><label>Nilai tersebut</label><select id="pjMode"><option value="dpp">Belum termasuk PPN (DPP)</option><option value="incl">Sudah termasuk PPN</option></select></div>' +
            '<div class="field"><label>Jenis Belanja</label><select id="pjJenis"><option value="barang">Barang (PPh Pasal 22)</option><option value="jasa">Jasa (PPh Pasal 23)</option><option value="honor">Honorarium (PPh Pasal 21)</option><option value="none">Tanpa PPh</option></select></div>' +
            '<div class="field"><label>Tarif PPN (%)</label><input id="pjPpn" class="num" inputmode="numeric" value="11"></div>' +
          '</div>' +
          '<div class="field"><label style="font-weight:600"><input type="checkbox" id="pjNpwp" checked style="width:auto;margin-right:7px;vertical-align:middle">Rekanan ber-NPWP <span class="muted">(tanpa NPWP, tarif PPh lebih tinggi)</span></label></div>' +
          '<div id="pjResult"></div>' +
        '</div>';
      ['pjNilai','pjMode','pjJenis','pjPpn','pjNpwp'].forEach(function(id){
        var el = document.getElementById(id);
        el.addEventListener('input', hitungPajak);
        el.addEventListener('change', hitungPajak);
      });
      hitungPajak();
    }
    function hitungPajak(){
      var nilai = parseRupiahJS(document.getElementById('pjNilai').value);
      var mode = document.getElementById('pjMode').value;
      var jenis = document.getElementById('pjJenis').value;
      var ppnRate = (parseFloat(document.getElementById('pjPpn').value)||0)/100;
      var npwp = document.getElementById('pjNpwp').checked;
      var dpp = mode==='incl' ? Math.round(nilai/(1+ppnRate)) : nilai;
      var ppn = Math.round(dpp*ppnRate);
      var pphRate = 0, pphLabel = 'Tanpa PPh';
      if (jenis==='barang'){ pphRate = npwp?0.015:0.03; pphLabel='PPh Pasal 22 ('+(npwp?'1,5':'3')+'%)'; }
      else if (jenis==='jasa'){ pphRate = npwp?0.02:0.04; pphLabel='PPh Pasal 23 ('+(npwp?'2':'4')+'%)'; }
      else if (jenis==='honor'){ pphRate = npwp?0.05:0.06; pphLabel='PPh Pasal 21 ('+(npwp?'5':'6')+'%)'; }
      var pph = Math.round(dpp*pphRate);
      var bruto = dpp+ppn;
      var dibayar = bruto - pph;
      document.getElementById('pjResult').innerHTML =
        '<table>' +
          '<tr><td>Dasar Pengenaan Pajak (DPP)</td><td class="num">'+rupiah(dpp)+'</td></tr>' +
          '<tr><td>PPN ('+(ppnRate*100)+'%)</td><td class="num">'+rupiah(ppn)+'</td></tr>' +
          '<tr><td>'+pphLabel+' (dipotong)</td><td class="num">- '+rupiah(pph)+'</td></tr>' +
          '<tr><th>Nilai Bruto (DPP + PPN)</th><th class="num">'+rupiah(bruto)+'</th></tr>' +
          '<tr><th>Dibayar ke rekanan (Bruto - PPh)</th><th class="num">'+rupiah(dibayar)+'</th></tr>' +
          '<tr><th>Disetor ke negara (PPN + PPh)</th><th class="num">'+rupiah(ppn+pph)+'</th></tr>' +
        '</table>' +
        '<div class="hint" style="margin-top:12px">Estimasi. Tarif dapat berbeda sesuai ketentuan terbaru & status NPWP. PPh 21 honorarium memakai tarif sederhana.</div>';
    }

    function cetakLaporan(){
      var period = document.getElementById('expPeriod').value;
      var jenjang = document.getElementById('expJenjang').value;
      Promise.all([
        gcall('apiGetTransactions', { schoolId: STATE.schoolId }),
        gcall('apiGetSchool', { schoolId: STATE.schoolId })
      ]).then(function(arr){
        var tr = arr[0], sc = arr[1];
        if (!tr || !tr.ok) throw new Error((tr&&tr.error)||'Gagal memuat transaksi');
        var rows = (tr.rows||[]).filter(function(t){
          var p = t.bulan || trxPeriodOf(t.timestamp);
          if (period!=='*' && p!==period) return false;
          if (jenjang && String(t.jenjang||'')!==jenjang) return false;
          return true;
        });
        if (!rows.length){ toast('Belum ada data untuk filter ini.','err'); return; }
        var school = (sc&&sc.ok&&sc.school) ? sc.school : {namaSekolah:STATE.schoolName,kepalaSekolah:'-',bendahara:'-',alamat:'-'};
        var totDpp=0, totPpn=0, totAll=0;
        var body = rows.map(function(t,i){
          var dpp=Number(t.jumlah)||0, ppn=Math.round(dpp*0.11), tot=dpp+ppn;
          totDpp+=dpp; totPpn+=ppn; totAll+=tot;
          return '<tr><td>'+(i+1)+'</td><td>'+esc(t.kode)+'</td><td>'+esc(t.nama)+'</td><td>'+esc(bulanLabel(t.bulan))+'</td><td>'+esc(t.jenjang||'-')+'</td><td class="r">'+rupiah(dpp)+'</td><td class="r">'+rupiah(ppn)+'</td><td class="r">'+rupiah(tot)+'</td></tr>';
        }).join('');
        var periodLabel = period==='*' ? 'Semua Periode' : bulanLabel(period);
        var today = new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
        var html = '<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Laporan SPJ</title>' +
          '<style>body{font-family:Arial,sans-serif;padding:26px;color:#111;font-size:12px}' +
          '.kop{text-align:center;border-bottom:3px double #111;padding-bottom:10px;margin-bottom:14px}' +
          '.kop h1{font-size:18px;margin:0}.kop p{margin:2px 0}' +
          'table.t{width:100%;border-collapse:collapse;margin-top:8px}table.t th,table.t td{border:1px solid #555;padding:5px 7px}table.t th{background:#eee}.r{text-align:right}' +
          '.ttd{margin-top:34px;width:100%}.ttd td{text-align:center;vertical-align:top;width:50%}' +
          '@media print{.noprint{display:none}}</style></head><body>' +
          '<div class="kop"><h1>'+esc(school.namaSekolah||'Sekolah')+'</h1><p>'+esc(school.alamat||'')+'</p>' +
          '<h2 style="margin:8px 0 0;font-size:15px">LAPORAN SURAT PERTANGGUNGJAWABAN (SPJ)</h2>' +
          '<p>Periode: '+esc(periodLabel)+(jenjang?(' &middot; Jenjang: '+esc(jenjang)):'')+'</p></div>' +
          '<table class="t"><thead><tr><th>No</th><th>Kode</th><th>Uraian Kegiatan</th><th>Bulan</th><th>Jenjang</th><th>DPP</th><th>PPN 11%</th><th>Total</th></tr></thead>' +
          '<tbody>'+body+'</tbody>' +
          '<tfoot><tr><th colspan="5">TOTAL</th><th class="r">'+rupiah(totDpp)+'</th><th class="r">'+rupiah(totPpn)+'</th><th class="r">'+rupiah(totAll)+'</th></tr></tfoot></table>' +
          '<table class="ttd"><tr><td>Mengetahui,<br>Kepala Sekolah<br><br><br><br><b>'+esc(school.kepalaSekolah||'-')+'</b></td>' +
          '<td>'+esc(school.namaSekolah||'')+', '+today+'<br>Bendahara<br><br><br><br><b>'+esc(school.bendahara||'-')+'</b></td></tr></table>' +

      }).catch(function(err){ toast('Gagal: '+err.message,'err'); });
    }

    function loadRealisasi(){
      var box=document.getElementById('realBox'); box.innerHTML='<div class="empty">Memuat...</div>';
      gcall('apiGetRealisasi',{tahun:document.getElementById('realTahun').value}).then(function(res){
        if(!res||!res.ok) throw new Error((res&&res.error)||'Gagal');
        if(!res.items.length){ box.innerHTML='<div class="empty">Belum ada data. Isi Pagu (RKKAL) &amp; transaksi tahun ini dulu.</div>'; return; }
        var rows=res.items.map(function(o){
          var warn = o.saldo<0 ? ' style="color:#991b1b;font-weight:600"' : '';
          return '<tr><td class="mono">'+esc(o.kode)+'</td><td>'+esc(o.uraian)+'</td><td class="num">'+rupiah(o.pagu)+'</td><td class="num">'+rupiah(o.realisasi)+'</td><td class="num"'+warn+'>'+rupiah(o.saldo)+'</td><td class="num">'+o.persen+'%</td></tr>';
        }).join('');
        var t=res.total; var pct=t.pagu>0?Math.round(t.realisasi/t.pagu*1000)/10:0;
        box.innerHTML='<div style="overflow-x:auto"><table><thead><tr><th>Kode Akun</th><th>Uraian</th><th class="num">Pagu</th><th class="num">Realisasi</th><th class="num">Saldo</th><th class="num">%</th></tr></thead><tbody>'+rows+'</tbody>' +
          '<tfoot><tr><th colspan="2">TOTAL</th><th class="num">'+rupiah(t.pagu)+'</th><th class="num">'+rupiah(t.realisasi)+'</th><th class="num">'+rupiah(t.saldo)+'</th><th class="num">'+pct+'%</th></tr></tfoot></table></div>';
      }).catch(function(err){ box.innerHTML='<div class="empty">Gagal: '+esc(err.message)+'</div>'; });
    }

    /* ===================== Pengaturan ===================== */
    function renderPengaturan(){
      var c = document.getElementById('content');
      c.innerHTML =
        '<div class="panel">' +
          '<h2>Profil Sekolah</h2>' +
          '<p class="desc">Identitas ini dipakai pada laporan SPJ.</p>' +
          '<div class="grid2">' +
            '<div class="field"><label>Nama Sekolah</label><input id="pfNama"></div>' +
            '<div class="field"><label>Kepala Sekolah</label><input id="pfKepala"></div>' +
            '<div class="field"><label>Bendahara</label><input id="pfBendahara"></div>' +
            '<div class="field"><label>Alamat</label><input id="pfAlamat"></div>' +
          '</div>' +
          '<div class="row-actions"><button class="btn primary" id="pfSave">&#128190; Simpan Profil</button></div>' +
        '</div>';
      gcall('apiGetSchool', { schoolId: STATE.schoolId }).then(function(res){
        if (res && res.ok && res.school){
          var s = res.school;
          val('pfNama', s.namaSekolah); val('pfKepala', s.kepalaSekolah);
          val('pfBendahara', s.bendahara); val('pfAlamat', s.alamat);
        }
      }).catch(function(err){ toast('Gagal memuat profil: ' + err.message, 'err'); });

      document.getElementById('pfSave').addEventListener('click', function(){
        var payload = {
          schoolId: STATE.schoolId,
          namaSekolah: getVal('pfNama'), kepalaSekolah: getVal('pfKepala'),
          bendahara: getVal('pfBendahara'), alamat: getVal('pfAlamat')
        };
        gcall('apiSaveSchool', payload).then(function(res){
          if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
          STATE.schoolName = payload.namaSekolah || STATE.schoolName;
          document.getElementById('schoolName').textContent = STATE.schoolName;
          toast('Profil tersimpan.', 'ok');
        }).catch(function(err){ toast('Gagal: ' + err.message, 'err'); });
      });
    }
    function val(id,v){ var el=document.getElementById(id); if(el) el.value = (v==null?'':v); }
    function getVal(id){ var el=document.getElementById(id); return el?el.value:''; }

    /* ===================== Login & Boot ===================== */
    function boot(){
      var token = localStorage.getItem('erp_token');
      if (token){
        STATE.token = token;
        gcall('apiCheckSession', { token: token }).then(function(res){
          if (res && res.ok){ STATE.role=res.role; STATE.userName=res.nama; afterLogin(); }
          else { STATE.token=''; localStorage.removeItem('erp_token'); showLogin(); }
        }).catch(function(){ STATE.token=''; showLogin(); });
      } else { showLogin(); }
    }
    function showLogin(){
      var el = document.getElementById('login');
      el.classList.add('show');
      el.innerHTML =
        '<form class="loginbox" id="loginForm">' +
          '<div class="llogo">SR</div>' +
          '<h2>ERP Keuangan Sekolah Rakyat</h2>' +
          '<p class="muted" style="margin-top:-2px;margin-bottom:14px">Masuk untuk melanjutkan</p>' +
          '<div class="field"><label>Username</label><input id="lgUser" autocomplete="username"></div>' +
          '<div class="field"><label>Password</label><input id="lgPass" type="password" autocomplete="current-password"></div>' +
          '<button class="btn primary" type="submit" id="lgBtn" style="width:100%;justify-content:center">Masuk</button>' +
          '<div class="hint" style="margin-top:14px;text-align:left">Akun default: <b>admin</b> / bendahara123 (Bendahara) atau <b>tendik</b> / tendik123 (Pelaksana). Ganti di sheet <b>Users</b>.</div>' +
        '</form>';
      document.getElementById('loginForm').addEventListener('submit', function(e){ e.preventDefault(); doLogin(); });
    }
    function doLogin(){
      var u = document.getElementById('lgUser').value;
      var p = document.getElementById('lgPass').value;
      var btn = document.getElementById('lgBtn'); btn.disabled = true;
      gcall('apiLogin', { username:u, password:p }).then(function(res){
        btn.disabled = false;
        if (!res || !res.ok) throw new Error((res&&res.error)||'Gagal login');
        STATE.token=res.token; STATE.role=res.role; STATE.userName=res.nama;
        localStorage.setItem('erp_token', res.token);
        afterLogin();
      }).catch(function(err){ btn.disabled=false; toast('Login gagal: '+err.message,'err'); });
    }
    function doLogout(){
      var t = STATE.token;
      STATE.token=''; STATE.role=''; STATE.userName='';
      localStorage.removeItem('erp_token');
      gcall('apiLogout', { token:t });
      document.getElementById('logoutBtn').style.display='none';
      document.getElementById('userBadge').style.display='none';
      showLogin();
    }
    function applyRole(){
      var isBdh = STATE.role === 'bendahara';
      var setBtn = document.querySelector('#nav button[data-page="pengaturan"]');
      if (setBtn) setBtn.style.display = isBdh ? '' : 'none';
      var badge = document.getElementById('userBadge');
      badge.textContent = (STATE.userName||'') + ' \u00b7 ' + (isBdh ? 'Bendahara' : 'Pelaksana');
      badge.style.display = '';
      document.getElementById('logoutBtn').style.display = '';
    }
    function afterLogin(){
      document.getElementById('login').classList.remove('show');
      applyRole();
      gcall('apiBootstrap', null).then(function(res){
        if (!res || !res.ok) throw new Error((res && res.error) || 'Bootstrap gagal');
        STATE.schoolId = res.schoolId;
        STATE.schoolName = (res.schools && res.schools[0] && res.schools[0].nama) || 'Sekolah Rakyat';
        document.getElementById('schoolName').textContent = STATE.schoolName;
        document.getElementById('schoolId').textContent = res.schoolId || '';
        if (res.spreadsheetUrl){ var link=document.getElementById('sheetLink'); link.href=res.spreadsheetUrl; link.style.display='block'; }
        navigate('dashboard');
      }).catch(function(err){
        document.getElementById('schoolName').textContent = 'Gagal terhubung';
        toast('Bootstrap: ' + err.message, 'err');
        navigate('dashboard');
      });
    }

    // Wire nav + refresh + logout
    document.getElementById('nav').addEventListener('click', function(e){
      var btn = e.target.closest ? e.target.closest('button[data-page]') : null;
      if (!btn){ var t=e.target; while(t && t!==this){ if(t.getAttribute && t.getAttribute('data-page')){btn=t;break;} t=t.parentNode; } }
      if (btn) navigate(btn.getAttribute('data-page'));
    });
    document.getElementById('refreshBtn').addEventListener('click', function(){
      var active = document.querySelector('#nav button.active');
      navigate(active ? active.getAttribute('data-page') : 'dashboard');
    });
    document.getElementById('logoutBtn').addEventListener('click', doLogout);

    boot();
  </script>
</body>
</html>
