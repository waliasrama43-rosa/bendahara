<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>ERP Keuangan Sekolah Rakyat</title>
  <style>
    :root{
      --bg:#0f172a; --panel:#111827; --card:#1e293b; --line:#334155;
      --txt:#e2e8f0; --muted:#94a3b8; --brand:#22c55e; --brand-2:#16a34a;
      --accent:#38bdf8; --warn:#f59e0b; --danger:#ef4444; --ok:#22c55e;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{
      font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
      background:#f1f5f9;color:#0f172a;font-size:14px;
    }
    /* Layout */
    .app{display:flex;min-height:100vh}
    .sidebar{
      width:248px;background:linear-gradient(180deg,#0f172a,#111827);
      color:#e2e8f0;padding:18px 14px;flex-shrink:0;
    }
    .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
    .brand .logo{
      width:38px;height:38px;border-radius:10px;flex-shrink:0;
      background:linear-gradient(135deg,var(--brand),var(--accent));
      display:flex;align-items:center;justify-content:center;font-weight:800;color:#04210f;
    }
    .brand b{font-size:15px;line-height:1.1}
    .brand small{color:var(--muted);font-size:11px}
    .nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
    .nav button{
      display:flex;align-items:center;gap:10px;width:100%;text-align:left;
      background:transparent;border:0;color:#cbd5e1;padding:10px 12px;border-radius:10px;
      cursor:pointer;font-size:13.5px;transition:.15s;
    }
    .nav button:hover{background:#1f2937;color:#fff}
    .nav button.active{background:linear-gradient(90deg,var(--brand-2),#0e7a37);color:#fff;font-weight:600}
    .nav .ico{width:18px;text-align:center}
    .sidebar .school{
      margin-top:18px;padding:12px;border:1px solid #1f2937;border-radius:10px;
      background:#0b1220;font-size:12px;color:var(--muted)
    }
    .sidebar .school b{color:#e2e8f0;display:block;font-size:13px;margin-top:2px}

    .main{flex:1;display:flex;flex-direction:column;min-width:0}
    .topbar{
      background:#fff;border-bottom:1px solid #e2e8f0;padding:14px 22px;
      display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:5
    }
    .topbar h1{font-size:17px;margin:0}
    .topbar .sub{color:#64748b;font-size:12px;margin-top:2px}
    .content{padding:22px;max-width:1100px;width:100%}

    /* Cards */
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .stat{
      background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;
      box-shadow:0 1px 2px rgba(15,23,42,.04)
    }
    .stat .label{color:#64748b;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
    .stat .value{font-size:26px;font-weight:800;margin-top:8px;color:#0f172a}
    .stat .value.small{font-size:20px}
    .stat .pill{display:inline-block;margin-top:8px;font-size:11px;padding:3px 8px;border-radius:999px}
    .stat.green{border-top:3px solid var(--brand)}
    .stat.blue{border-top:3px solid var(--accent)}
    .stat.amber{border-top:3px solid var(--warn)}
    .stat.red{border-top:3px solid var(--danger)}
    .pill.green{background:#dcfce7;color:#166534}
    .pill.amber{background:#fef3c7;color:#92400e}
    .pill.blue{background:#e0f2fe;color:#075985}

    .panel{
      background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin-top:18px;
      box-shadow:0 1px 2px rgba(15,23,42,.04)
    }
    .panel h2{font-size:15px;margin:0 0 4px}
    .panel .desc{color:#64748b;font-size:12.5px;margin:0 0 14px}

    /* Tabs */
    .tabs{display:flex;gap:6px;border-bottom:1px solid #e2e8f0;margin-bottom:16px;flex-wrap:wrap}
    .tabs button{
      background:transparent;border:0;border-bottom:2px solid transparent;
      padding:10px 14px;cursor:pointer;color:#64748b;font-size:13.5px;font-weight:600
    }
    .tabs button.active{color:var(--brand-2);border-bottom-color:var(--brand-2)}
    .tabpane{display:none}
    .tabpane.active{display:block}

    /* Tables */
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:9px 10px;text-align:left;border-bottom:1px solid #eef2f7;vertical-align:middle}
    th{color:#64748b;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;background:#f8fafc}
    td input,td select{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:8px;font-size:13px}
    td input:focus,td select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
    .right{text-align:right}
    .num{text-align:right;font-variant-numeric:tabular-nums}

    /* Buttons */
    .btn{
      border:0;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;
      display:inline-flex;align-items:center;gap:7px
    }
    .btn.primary{background:var(--brand-2);color:#fff}
    .btn.primary:hover{background:#0e7a37}
    .btn.ghost{background:#f1f5f9;color:#334155}
    .btn.ghost:hover{background:#e2e8f0}
    .btn.tiny{padding:5px 10px;font-size:12px;border-radius:8px}
    .btn.ok{background:#dcfce7;color:#166534}
    .btn.no{background:#fee2e2;color:#991b1b}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .row-actions{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap}

    .field{margin-bottom:12px}
    .field label{display:block;font-size:12.5px;color:#475569;margin-bottom:5px;font-weight:600}
    .field input,.field select,.field textarea{
      width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font-size:13.5px;font-family:inherit
    }
    .field textarea{min-height:150px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

    .badge{padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
    .badge.pending{background:#fef3c7;color:#92400e}
    .badge.verified{background:#dcfce7;color:#166534}
    .badge.rejected{background:#fee2e2;color:#991b1b}

    .empty{text-align:center;color:#94a3b8;padding:26px 10px;font-size:13px}
    .muted{color:#64748b}
    .mono{font-family:ui-monospace,Consolas,monospace}
    .hint{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:12px;color:#475569;font-size:12.5px}

    /* Toast */
    #toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50}
    .toast{
      background:#0f172a;color:#fff;padding:11px 15px;border-radius:10px;font-size:13px;
      box-shadow:0 10px 25px rgba(0,0,0,.25);min-width:220px;max-width:340px;animation:slideIn .2s ease
    }
    .toast.ok{background:#166534}
    .toast.err{background:#991b1b}
    @keyframes slideIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
    .modal-overlay.show{display:flex}
    .modal{background:#fff;border-radius:14px;padding:20px;width:430px;max-width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:slideIn .15s ease}
    .modal h3{margin:0 0 14px;font-size:16px}

    /* Loading bar */
    #loading{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;transition:width .3s;z-index:60}

    @media (max-width:820px){
      .app{flex-direction:column}
      .sidebar{width:100%}
      .nav{flex-direction:row;flex-wrap:wrap}
      .cards{grid-template-columns:repeat(2,1fr)}
      .grid2{grid-template-columns:1fr}
      .grid3{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div id="loading"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">SR</div>
        <div>
          <b>ERP Keuangan</b>
          <small>Sekolah Rakyat</small>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button data-page="dashboard" class="active"><span class="ico">&#9632;</span> Dashboard</button>
        <button data-page="rkkal"><span class="ico">&#43;</span> Arus Masuk - RKKAL</button>
        <button data-page="rekap"><span class="ico">&#9783;</span> Arus Keluar - Rekap SPJ</button>
        <button data-page="realisasi"><span class="ico">&#9776;</span> Realisasi Anggaran</button>
        <button data-page="pajak"><span class="ico">&#37;</span> Kalkulator Pajak</button>
        <button data-page="export"><span class="ico">&#8595;</span> Export Laporan</button>
        <button data-page="pengaturan"><span class="ico">&#9881;</span> Pengaturan Sekolah</button>
      </nav>
      <div class="school">
        Sekolah Aktif
        <b id="schoolName">Memuat...</b>
        <span class="mono" id="schoolId"></span>
        <a id="sheetLink" href="#" target="_blank" style="display:none;color:#7dd3fc;font-size:11.5px;margin-top:8px">&#128203; Buka Spreadsheet</a>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <div class="sub" id="pageSub">Ringkasan keuangan sekolah</div>
        </div>
        <button class="btn ghost" id="refreshBtn">&#8635; Muat Ulang</button>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>
  <div id="toast"></div>

  <div id="modal" class="modal-overlay">
    <div class="modal">
      <h3 id="modalTitle">Edit</h3>
      <div id="modalBody"></div>
      <div class="row-actions" style="justify-content:flex-end;margin-top:8px">
        <button class="btn ghost" type="button" onclick="closeModal()">Batal</button>
        <button class="btn primary" type="button" id="modalSave">Simpan</button>
      </div>
    </div>
  </div>

  <script>
    /* ===================== STATE & HELPERS ===================== */
    var STATE = { schoolId: null, schoolName: '', refs: {} };
    var loadingCount = 0;

    function showLoading(on){
      loadingCount += on ? 1 : -1;
      if (loadingCount < 0) loadingCount = 0;
      var bar = document.getElementById('loading');
      bar.style.width = loadingCount > 0 ? '85%' : '0';
      if (loadingCount === 0) setTimeout(function(){ bar.style.width='0'; }, 120);
    }

    function gcall(fn, payload){
      return new Promise(function(resolve, reject){
        if (typeof google === 'undefined' || !google.script || !google.script.run){
          reject(new Error('google.script.run tidak tersedia (jalankan via Web App Apps Script).'));
          return;
        }
        showLoading(true);
        google.script.run
          .withSuccessHandler(function(res){ showLoading(false); resolve(res); })
          .withFailureHandler(function(err){ showLoading(false); reject(err); })
          [fn](payload);
      });
    }

    function toast(msg, type){
      var box = document.getElementById('toast');
      var el = document.createElement('div');
      el.className = 'toast ' + (type || '');
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(function(){ el.style.opacity='0'; el.style.transition='opacity .3s'; }, 2600);
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 3000);
    }

    function rupiah(n){
      n = Number(n) || 0;
      return 'Rp ' + n.toLocaleString('id-ID');
    }
    function esc(s){
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
    }
    function fmtDate(s){
      if(!s) return '-';
      var d = new Date(s);
      if (isNaN(d.getTime())) return String(s);
      return d.toLocaleDateString('id-ID', {day:'2-digit',month:'short',year:'numeric'});
    }

    function openModal(title, bodyHtml, onSave){
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = bodyHtml;
      document.getElementById('modal').classList.add('show');
      document.getElementById('modalSave').onclick = onSave;
    }
    function closeModal(){ document.getElementById('modal').classList.remove('show'); }

    function setText(id, txt){ var el=document.getElementById(id); if(el) el.innerHTML = txt; }
    function val(id,v){ var el=document.getElementById(id); if(el) el.value = (v==null?'':v); }
    function getVal(id){ var el=document.getElementById(id); return el?el.value:''; }

    /* ===================== Dropdown Helpers ===================== */
    function akunOptions(selected){
      var items = (STATE.refs.KODE_AKUN || []);
      var html = '<option value="">(pilih akun)</option>';
      items.forEach(function(it){ html += '<option value="'+esc(it.kode)+'"'+(it.kode===selected?' selected':'')+'>'+esc(it.kode)+' - '+esc(it.nama)+'</option>'; });
      return html;
    }
    function kegiatanOptions(selected){
      var items = (STATE.refs.KEGIATAN || []);
      var html = '<option value="">(pilih kegiatan)</option>';
      items.forEach(function(it){ html += '<option value="'+esc(it.kode)+'"'+(it.kode===selected?' selected':'')+'>'+esc(it.kode)+' - '+esc(it.nama)+'</option>'; });
      return html;
    }
    function makPrefixOptions(selected){
      var items = (STATE.refs.MAK_PREFIX || []);
      var html = '<option value="">(pilih prefix)</option>';
      items.forEach(function(it){ html += '<option value="'+esc(it.kode)+'"'+(it.kode===selected?' selected':'')+'>'+esc(it.kode)+' - '+esc(it.nama)+'</option>'; });
      return html;
    }
    function satuanOptions(selected){
      var items = (STATE.refs.SATUAN || []);
      var html = '<option value="">(pilih)</option>';
      items.forEach(function(it){ html += '<option value="'+esc(it)+'"'+(it===selected?' selected':'')+'>'+esc(it)+'</option>'; });
      return html;
    }
    function tahunOptions(selected){
      var items = (STATE.refs.TAHUN || []);
      var html = '<option value="">(pilih tahun)</option>';
      items.forEach(function(it){ html += '<option value="'+it+'"'+(String(it)===String(selected)?' selected':'')+'>'+it+'</option>'; });
      return html;
    }
    function bulanNamaOptions(selected){
      var items = (STATE.refs.BULAN || []);
      var html = '<option value="">(pilih bulan)</option>';
      items.forEach(function(it){ html += '<option value="'+esc(it)+'"'+(it===selected?' selected':'')+'>'+esc(it)+'</option>'; });
      return html;
    }
    function jenjangOptions(selected, firstLabel){
      var items = (STATE.refs.JENJANG || []);
      var html = '<option value="">'+(firstLabel||'(pilih jenjang)')+'</option>';
      items.forEach(function(it){ html += '<option value="'+esc(it)+'"'+(it===selected?' selected':'')+'>'+esc(it)+'</option>'; });
      return html;
    }

    /* ===================== Terbilang (client-side) ===================== */
    function terbilang(n){
      n = Math.floor(Math.abs(Number(n)||0));
      var sat = ['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
      function w(x){
        if (x < 12) return sat[x];
        if (x < 20) return w(x-10)+' belas';
        if (x < 100) return w(Math.floor(x/10))+' puluh'+(x%10? ' '+w(x%10):'');
        if (x < 200) return 'seratus'+(x-100? ' '+w(x-100):'');
        if (x < 1000) return w(Math.floor(x/100))+' ratus'+(x%100? ' '+w(x%100):'');
        if (x < 2000) return 'seribu'+(x-1000? ' '+w(x-1000):'');
        if (x < 1000000) return w(Math.floor(x/1000))+' ribu'+(x%1000? ' '+w(x%1000):'');
        if (x < 1000000000) return w(Math.floor(x/1000000))+' juta'+(x%1000000? ' '+w(x%1000000):'');
        return w(Math.floor(x/1000000000))+' miliar'+(x%1000000000? ' '+w(x%1000000000):'');
      }
      if (n===0) return 'nol';
      var s = w(n);
      while (s.indexOf('  ')>=0) s = s.split('  ').join(' ');
      return s.trim();
    }

    /* ===================== parseRupiahJS ===================== */
    function parseRupiahJS(v){ var s=String(v==null?'':v), o=''; for(var i=0;i<s.length;i++){ var ch=s.charAt(i); if(ch>='0'&&ch<='9') o+=ch; } return parseInt(o,10)||0; }

    /* ===================== Router ===================== */
    var PAGE_META = {
      dashboard:   { title:'Dashboard', sub:'Ringkasan keuangan sekolah' },
      rkkal:       { title:'Arus Masuk - RKKAL', sub:'Rencana Kerja & Anggaran Kegiatan' },
      rekap:       { title:'Arus Keluar - Rekap SPJ', sub:'Realisasi belanja / kwitansi' },
      realisasi:   { title:'Realisasi Anggaran', sub:'Perbandingan pagu vs realisasi' },
      pajak:       { title:'Kalkulator Pajak', sub:'Hitung PPN & PPh (Pasal 22/23/21)' },
      export:      { title:'Export Laporan', sub:'Unduh laporan dalam format CSV' },
      pengaturan:  { title:'Pengaturan Sekolah', sub:'Profil & diagnostik sistem' }
    };

    function navigate(page){
      var btns = document.querySelectorAll('#nav button');
      for (var i=0;i<btns.length;i++){
        btns[i].classList.toggle('active', btns[i].getAttribute('data-page') === page);
      }
      var meta = PAGE_META[page] || PAGE_META.dashboard;
      document.getElementById('pageTitle').textContent = meta.title;
      document.getElementById('pageSub').textContent = meta.sub;

      if (page === 'dashboard') renderDashboard();
      else if (page === 'rkkal') renderRKKAL();
      else if (page === 'rekap') renderRekap();
      else if (page === 'realisasi') renderRealisasi();
      else if (page === 'pajak') renderPajak();
      else if (page === 'export') renderExport();
      else if (page === 'pengaturan') renderPengaturan();
    }

    /* ===================== Dashboard ===================== */
    function renderDashboard(){
      var c = document.getElementById('content');
      c.innerHTML =
        '<div class="cards">' +
          card('green','Total Pagu','dashPagu','anggaran RKKAL') +
          card('blue','Realisasi','dashRealisasi','arus keluar') +
          card('amber','Sisa Anggaran','dashSisa','pagu - realisasi') +
          card('green','Serapan','dashSerapan','persentase realisasi') +
        '</div>' +
        '<div class="cards" style="margin-top:14px">' +
          card('blue','Jumlah RKKAL','dashRkkal','item anggaran') +
          card('blue','Jumlah Rekap','dashRekap','transaksi keluar') +
          card('green','Terverifikasi','dashVerif','disetujui') +
          card('amber','Pending','dashPending','menunggu') +
        '</div>' +
        '<div class="panel">' +
          '<h2>Selamat datang</h2>' +
          '<p class="desc">Gunakan menu sidebar untuk mengelola anggaran (RKKAL) dan realisasi (Rekap SPJ).</p>' +
          '<div class="row-actions">' +
            '<button class="btn primary" onclick="navigate(\'rkkal\')">+ Input RKKAL</button>' +
            '<button class="btn ghost" onclick="navigate(\'rekap\')">Input Rekap SPJ</button>' +
          '</div>' +
        '</div>';

      gcall('apiGetDashboard', { schoolId: STATE.schoolId }).then(function(res){
        if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal memuat');
        var s = res.summary || {};
        setText('dashPagu', rupiah(s.pagu || 0));
        setText('dashRealisasi', rupiah(s.realisasi || 0));
        setText('dashSisa', rupiah(s.sisa || 0));
        setText('dashSerapan', (s.serapan || 0) + '%');
        setText('dashRkkal', String(s.jumlahRKKAL || 0));
        setText('dashRekap', String(s.jumlahRekap || 0));
        setText('dashVerif', String(s.verif || 0));
        setText('dashPending', String(s.pending || 0));
      }).catch(function(err){
        toast('Dashboard: ' + err.message, 'err');
      });
    }
    function card(color,label,id,pill){
      return '<div class="stat '+color+'">' +
        '<div class="label">'+label+'</div>' +
        '<div class="value small" id="'+id+'">...</div>' +
        '<span class="pill '+color+'">'+pill+'</span>' +
      '</div>';
    }

    /* ===================== RKKAL (Arus Masuk) ===================== */
    var rkkalRowCount = 0;
    function renderRKKAL(){
      var c = document.getElementById('content');
      c.innerHTML =
        '<div class="panel">' +
          '<div class="tabs" id="rkkalTabs">' +
            '<button data-tab="manual" class="active">Input Manual</button>' +
            '<button data-tab="daftar">Daftar RKKAL</button>' +
            '<button data-tab="upload">Upload CSV</button>' +
          '</div>' +

          '<div class="tabpane active" data-pane="manual">' +
            '<h2>Input Manual RKKAL</h2>' +
            '<p class="desc">Pilih Tahun & Jenjang, isi tabel, lalu klik Simpan Semua.</p>' +
            '<div class="grid2">' +
              '<div class="field"><label>Tahun</label><select id="rkkalTahun">'+tahunOptions(new Date().getFullYear())+'</select></div>' +
              '<div class="field"><label>Jenjang</label><select id="rkkalJenjang">'+jenjangOptions('')+'</select></div>' +
            '</div>' +
            '<div style="overflow-x:auto"><table><thead><tr>' +
              '<th>#</th><th>Kegiatan</th><th>Kode Akun</th><th>Uraian</th><th>Volume</th><th>Satuan</th><th>Harga Satuan</th><th>Jumlah</th><th></th>' +
            '</tr></thead><tbody id="rkkalBody"></tbody></table></div>' +
            '<div class="row-actions">' +
              '<button class="btn ghost" id="rkkalAddRow">+ Tambah Baris</button>' +
              '<button class="btn primary" id="rkkalSave">Simpan Semua</button>' +
            '</div>' +
          '</div>' +

          '<div class="tabpane" data-pane="daftar">' +
            '<h2>Daftar RKKAL</h2>' +
            '<p class="desc">Filter dan kelola data anggaran yang sudah tersimpan.</p>' +
            '<div class="grid3">' +
              '<div class="field"><label>Tahun</label><select id="rkkalListTahun">'+tahunOptions('')+'</select></div>' +

    function wireRkkalTabs(){
      var tabs = document.querySelectorAll('#rkkalTabs button');
      for (var i=0;i<tabs.length;i++){
        tabs[i].addEventListener('click', function(){
          var name = this.getAttribute('data-tab');
          var allBtns = document.querySelectorAll('#rkkalTabs button');
          for (var j=0;j<allBtns.length;j++) allBtns[j].classList.toggle('active', allBtns[j]===this);
          var panes = this.closest('.panel').querySelectorAll('[data-pane]');
          for (var k=0;k<panes.length;k++) panes[k].classList.toggle('active', panes[k].getAttribute('data-pane')===name);
        });
      }
    }

    function addRkkalRow(){
      rkkalRowCount++;
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="muted">'+rkkalRowCount+'</td>' +
        '<td><select class="rk-keg">'+kegiatanOptions('')+'</select></td>' +
        '<td><select class="rk-akun">'+akunOptions('')+'</select></td>' +
        '<td><input class="rk-uraian" placeholder="Uraian"></td>' +
        '<td><input class="rk-vol" type="number" placeholder="0" style="width:70px"></td>' +
        '<td><select class="rk-sat">'+satuanOptions('')+'</select></td>' +
        '<td><input class="rk-harga" type="number" placeholder="0" style="width:110px"></td>' +
        '<td><input class="rk-jumlah" readonly style="width:110px;background:#f8fafc"></td>' +
        '<td><button class="btn no tiny" title="Hapus">&#10005;</button></td>';
      tr.querySelector('.rk-vol').addEventListener('input', function(){ calcRkkalRow(tr); });
      tr.querySelector('.rk-harga').addEventListener('input', function(){ calcRkkalRow(tr); });
      tr.querySelector('button').addEventListener('click', function(){ tr.parentNode.removeChild(tr); renumberRkkal(); });
      document.getElementById('rkkalBody').appendChild(tr);
    }
    function calcRkkalRow(tr){
      var vol = Number(tr.querySelector('.rk-vol').value) || 0;
      var harga = Number(tr.querySelector('.rk-harga').value) || 0;
      tr.querySelector('.rk-jumlah').value = vol * harga;
    }
    function renumberRkkal(){
      var rows = document.querySelectorAll('#rkkalBody tr');
      for (var i=0;i<rows.length;i++) rows[i].cells[0].textContent = (i+1);
      rkkalRowCount = rows.length;
    }

    function saveRkkal(){
      var tahun = getVal('rkkalTahun');
      var jenjang = getVal('rkkalJenjang');
      if (!tahun){ toast('Pilih Tahun.', 'err'); return; }
      var trs = document.querySelectorAll('#rkkalBody tr');
      var rows = [];
      for (var i=0;i<trs.length;i++){
        var vol = Number(trs[i].querySelector('.rk-vol').value) || 0;
        var harga = Number(trs[i].querySelector('.rk-harga').value) || 0;
        rows.push({
          kodeKegiatan: trs[i].querySelector('.rk-keg').value,
          kodeAkun: trs[i].querySelector('.rk-akun').value,
          uraian: trs[i].querySelector('.rk-uraian').value,
          volume: vol,
          satuan: trs[i].querySelector('.rk-sat').value,
          hargaSatuan: harga,
          jumlahBiaya: vol * harga
        });
      }
      var btn = document.getElementById('rkkalSave');
      btn.disabled = true;
      gcall('apiSaveRKKAL', { schoolId: STATE.schoolId, tahun: tahun, jenjang: jenjang, rows: rows }).then(function(res){
        btn.disabled = false;
        if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
        toast(res.saved + ' baris tersimpan' + (res.skipped ? ', '+res.skipped+' dilewati':''), 'ok');
        if (res.saved > 0) renderRKKAL();
      }).catch(function(err){ btn.disabled=false; toast('Gagal: '+err.message, 'err'); });
    }

    function loadRkkalList(){
      var tahun = getVal('rkkalListTahun');
      var jenjang = getVal('rkkalListJenjang');
      var box = document.getElementById('rkkalListBox');
      box.innerHTML = '<div class="empty">Memuat...</div>';
      gcall('apiGetRKKAL', { schoolId: STATE.schoolId, tahun: tahun || undefined, jenjang: jenjang || undefined }).then(function(res){
        if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
        if (!res.rows || !res.rows.length){ box.innerHTML = '<div class="empty">Tidak ada data RKKAL.</div>'; return; }
        var rows = res.rows.map(function(r){
          return '<tr>' +
            '<td class="mono">'+esc(r.kodeKegiatan)+'</td>' +
            '<td class="mono">'+esc(r.kodeAkun)+'</td>' +
            '<td>'+esc(r.uraian)+'</td>' +
            '<td class="num">'+r.volume+'</td>' +
            '<td>'+esc(r.satuan)+'</td>' +
            '<td class="num">'+rupiah(r.hargaSatuan)+'</td>' +
            '<td class="num">'+rupiah(r.jumlahBiaya)+'</td>' +
            '<td style="white-space:nowrap">' +
              '<button class="btn ghost tiny" onclick="editRkkal(\''+r.id+'\')">Edit</button> ' +
              '<button class="btn no tiny" onclick="deleteRkkal(\''+r.id+'\')">Hapus</button>' +
            '</td></tr>';
        }).join('');
        box.innerHTML = '<table><thead><tr><th>Keg</th><th>Akun</th><th>Uraian</th><th class="num">Vol</th><th>Sat</th><th class="num">Harga</th><th class="num">Jumlah</th><th>Aksi</th></tr></thead>' +
          '<tbody>'+rows+'</tbody>' +
          '<tfoot><tr><th colspan="6" class="right">TOTAL</th><th class="num">'+rupiah(res.total)+'</th><th></th></tr></tfoot></table>';
        STATE._rkkalRows = res.rows;
      }).catch(function(err){ box.innerHTML = '<div class="empty">Gagal: '+esc(err.message)+'</div>'; });
    }

    function editRkkal(id){
      var rows = STATE._rkkalRows || [];
      var r = null;
      for (var i=0;i<rows.length;i++){ if(rows[i].id===id){ r=rows[i]; break; } }
      if (!r) return;
      openModal('Edit RKKAL',
        '<div class="grid2">' +
          '<div class="field"><label>Kegiatan</label><select id="edRkKeg">'+kegiatanOptions(r.kodeKegiatan)+'</select></div>' +
          '<div class="field"><label>Kode Akun</label><select id="edRkAkun">'+akunOptions(r.kodeAkun)+'</select></div>' +
        '</div>' +
        '<div class="field"><label>Uraian</label><input id="edRkUraian" value="'+esc(r.uraian)+'"></div>' +
        '<div class="grid3">' +
          '<div class="field"><label>Volume</label><input id="edRkVol" type="number" value="'+r.volume+'"></div>' +
          '<div class="field"><label>Satuan</label><select id="edRkSat">'+satuanOptions(r.satuan)+'</select></div>' +
          '<div class="field"><label>Harga Satuan</label><input id="edRkHarga" type="number" value="'+r.hargaSatuan+'"></div>' +
        '</div>',
        function(){
          var vol = Number(document.getElementById('edRkVol').value) || 0;
          var harga = Number(document.getElementById('edRkHarga').value) || 0;
          gcall('apiUpdateRKKAL', {
            id: id,
            kodeKegiatan: document.getElementById('edRkKeg').value,
            kodeAkun: document.getElementById('edRkAkun').value,
            uraian: document.getElementById('edRkUraian').value,
            volume: vol, satuan: document.getElementById('edRkSat').value,
            hargaSatuan: harga, jumlahBiaya: vol * harga
          }).then(function(res){
            if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
            toast('RKKAL diperbarui.', 'ok'); closeModal(); loadRkkalList();
          }).catch(function(err){ toast('Gagal: '+err.message, 'err'); });
        });
    }

    function deleteRkkal(id){
      if (!confirm('Hapus item RKKAL ini?')) return;
      gcall('apiDeleteRKKAL', { id: id }).then(function(res){
        if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
        toast('Dihapus.', 'ok'); loadRkkalList();
      }).catch(function(err){ toast('Gagal: '+err.message, 'err'); });
    }

    function uploadRkkalCsv(){
      var csv = getVal('rkkalCsvText');
      if (!csv.trim()){ toast('Tempel data CSV.', 'err'); return; }
      var tahun = getVal('rkkalCsvTahun');
      var jenjang = getVal('rkkalCsvJenjang');
      var btn = document.getElementById('rkkalCsvBtn');
      btn.disabled = true;
      gcall('apiUploadRKKALCsv', { schoolId: STATE.schoolId, tahun: tahun, jenjang: jenjang, csv: csv }).then(function(res){
        btn.disabled = false;
        if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
        toast(res.processed + ' baris diimpor' + (res.errors ? ', '+res.errors+' gagal':''), res.processed?'ok':'err');
        if (res.processed) document.getElementById('rkkalCsvText').value = '';
      }).catch(function(err){ btn.disabled=false; toast('Gagal: '+err.message, 'err'); });

    function wireRekapTabs(){
      var tabs = document.querySelectorAll('#rekapTabs button');
      for (var i=0;i<tabs.length;i++){

    function updateMakPreview(){
      var prefix = getVal('rpPrefix');
      var keg = getVal('rpKeg');
      var akun = getVal('rpAkun');
      var parts = [];
      if (prefix) parts.push(prefix);
      if (keg) parts.push(keg);
      if (akun) parts.push(akun);
      setText('rpMakPreview', parts.length ? parts.join('.') : '-');
    }

    function saveRekapSingle(){
      var row = {
        tanggal: getVal('rpTanggal'),
        namaToko: getVal('rpToko'),
        makPrefix: getVal('rpPrefix'),
        kodeKegiatan: getVal('rpKeg'),
        kodeAkun: getVal('rpAkun'),
        jenjang: getVal('rpJenjang'),
        tahun: getVal('rpTahun'),
        bulan: getVal('rpBulan'),
        jumlah: getVal('rpJumlah'),
        uraian: getVal('rpUraian'),
        kodeMak: getVal('rpMakManual')
      };
      if (!row.namaToko){ toast('Nama Toko wajib diisi.', 'err'); return; }
      if (!row.kodeAkun){ toast('Kode Akun wajib dipilih.', 'err'); return; }
      if (!row.jumlah || Number(row.jumlah) <= 0){ toast('Jumlah harus > 0.', 'err'); return; }
      var btn = document.getElementById('rpSaveBtn');
      btn.disabled = true;
      gcall('apiSaveRekap', { schoolId: STATE.schoolId, rows: [row] }).then(function(res){
        btn.disabled = false;
        if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
        toast('Transaksi tersimpan.', 'ok');
        // Reset form
        ['rpTanggal','rpToko','rpJumlah','rpUraian','rpMakManual'].forEach(function(id){ val(id,''); });
        ['rpPrefix','rpKeg','rpAkun','rpJenjang','rpBulan'].forEach(function(id){ val(id,''); });
        updateMakPreview();
      }).catch(function(err){ btn.disabled=false; toast('Gagal: '+err.message, 'err'); });
    }

    var REKAP_ALL = [];
    function loadRekapList(){
      var tahun = getVal('rpListTahun');
      var bulan = getVal('rpListBulan');
      var jenjang = getVal('rpListJenjang');
      var box = document.getElementById('rpListBox');
      box.innerHTML = '<div class="empty">Memuat...</div>';
      gcall('apiGetRekap', { schoolId: STATE.schoolId, tahun: tahun || undefined, bulan: bulan || undefined, jenjang: jenjang || undefined }).then(function(res){
        if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
        REKAP_ALL = res.rows || [];
        if (!REKAP_ALL.length){ box.innerHTML = '<div class="empty">Tidak ada data rekap.</div>'; return; }
        var rows = REKAP_ALL.map(function(r){
          var st = (r.status||'pending').toLowerCase();
          var cls = st.indexOf('verif')>-1||st.indexOf('approve')>-1 ? 'verified' : (st.indexOf('reject')>-1||st.indexOf('tolak')>-1 ? 'rejected':'pending');
          var label = cls==='verified'?'Verified':(cls==='rejected'?'Ditolak':'Pending');
          var verifyBtns = cls==='pending'
            ? '<button class="btn ok tiny" onclick="verifyRekap(\''+r.id+'\',\'approve\')">Setujui</button> ' +
              '<button class="btn no tiny" onclick="verifyRekap(\''+r.id+'\',\'reject\')">Tolak</button> '
            : '';
          var buktiBtn = r.buktiUrl
            ? '<a class="btn ok tiny" href="'+esc(r.buktiUrl)+'" target="_blank">Bukti</a> '
            : '<button class="btn ghost tiny" onclick="uploadBuktiRekap(\''+r.id+'\')">Upload</button> ';
          var actions = verifyBtns +
            '<button class="btn ghost tiny" onclick="editRekap(\''+r.id+'\')">Edit</button> ' +
            '<button class="btn no tiny" onclick="deleteRekap(\''+r.id+'\')">Hapus</button> ' +
            '<button class="btn ghost tiny" onclick="kwitansiRekap(\''+r.id+'\')">Kwitansi</button> ' +
            buktiBtn;
          return '<tr>' +
            '<td>'+fmtDate(r.tanggal)+'</td>' +
            '<td>'+esc(r.namaToko)+'</td>' +
            '<td class="mono" style="font-size:11px">'+esc(r.kodeMak)+'</td>' +
            '<td>'+esc(r.uraian)+'</td>' +
            '<td class="num">'+rupiah(r.jumlah)+'</td>' +
            '<td>'+esc(r.jenjang||'-')+'</td>' +
            '<td><span class="badge '+cls+'">'+label+'</span></td>' +
            '<td style="white-space:nowrap">'+actions+'</td>' +
          '</tr>';
        }).join('');
        box.innerHTML = '<div style="overflow-x:auto"><table><thead><tr><th>Tanggal</th><th>Toko</th><th>Kode MAK</th><th>Uraian</th><th class="num">Jumlah</th><th>Jenjang</th><th>Status</th><th>Aksi</th></tr></thead>' +
          '<tbody>'+rows+'</tbody>' +
          '<tfoot><tr><th colspan="4" class="right">TOTAL ('+REKAP_ALL.length+')</th><th class="num">'+rupiah(res.total)+'</th><th colspan="3"></th></tr></tfoot></table></div>';
      }).catch(function(err){ box.innerHTML = '<div class="empty">Gagal: '+esc(err.message)+'</div>'; });
    }

    function findRekap(id){ for(var i=0;i<REKAP_ALL.length;i++){ if(REKAP_ALL[i].id===id) return REKAP_ALL[i]; } return null; }

    function verifyRekap(id, action){
      gcall('apiVerifyRekap', { id: id, action: action }).then(function(res){
        if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
        toast(action==='approve' ? 'Disetujui.' : 'Ditolak.', 'ok');
        loadRekapList();
      }).catch(function(err){ toast('Gagal: '+err.message, 'err'); });
    }

        '</div>' +

          '<div class="field"><label>Tahun</label><select id="edRpTahun">'+tahunOptions(r.tahun)+'</select></div>' +

        function(){

            kodeAkun: document.getElementById('edRpAkun').value,
            kodeKegiatan: document.getElementById('edRpKeg').value,

    function deleteRekap(id){
      if (!confirm('Hapus transaksi rekap ini?')) return;
      gcall('apiDeleteRekap', { id: id }).then(function(res){
        if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
        toast('Dihapus.', 'ok'); loadRekapList();
      }).catch(function(err){ toast('Gagal: '+err.message, 'err'); });
    }

    function uploadBuktiRekap(id){
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*,application/pdf';
      input.onchange = function(){
        var f = input.files[0]; if(!f) return;
        if (f.size > 5*1024*1024){ toast('Max 5 MB.', 'err'); return; }
        var reader = new FileReader();
        reader.onload = function(ev){
          var base64 = String(ev.target.result).split(',')[1] || '';
          toast('Mengunggah...');
          gcall('apiUploadBuktiRekap', { id:id, filename:f.name, mimeType:f.type, dataBase64:base64 }).then(function(res){
            if (!res || !res.ok) throw new Error((res&&res.error)||'Gagal');
            toast('Bukti diunggah.', 'ok'); loadRekapList();
          }).catch(function(err){ toast('Gagal: '+err.message, 'err'); });
        };
        reader.readAsDataURL(f);
      };
      input.click();
    }

    function uploadRekapCsv(){
      var csv = getVal('rpCsvText');
      if (!csv.trim()){ toast('Tempel data CSV.', 'err'); return; }
      var btn = document.getElementById('rpCsvBtn');
      btn.disabled = true;
      gcall('apiUploadRekapCsv', { schoolId: STATE.schoolId, csv: csv }).then(function(res){
        btn.disabled = false;
        if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
        toast(res.processed + ' baris diimpor' + (res.errors ? ', '+res.errors+' gagal':''), res.processed?'ok':'err');
        if (res.processed) document.getElementById('rpCsvText').value = '';

    }

    /* ===================== Kwitansi Rekap ===================== */
    function kwitansiRekap(id){
      var r = findRekap(id); if(!r) return;
      var sekolah = STATE.schoolName || 'Sekolah';
      var jml = Number(r.jumlah)||0;
      var terb = r.terbilang || (terbilang(jml).charAt(0).toUpperCase()+terbilang(jml).slice(1)+' rupiah');
      var no = 'KW/'+String(r.id||'').slice(-6)+'/'+(r.bulan||'');
      var html = '<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Kwitansi</title>' +
        '<style>body{font-family:Arial,sans-serif;padding:30px;color:#111}.kw{max-width:640px;margin:auto;border:2px solid #111;padding:24px;border-radius:8px}' +
        'h2{text-align:center;margin:0}.c{text-align:center}.muted{color:#555}.row{display:flex;margin:9px 0}.row .l{width:160px;color:#444}' +
        '.box{border:1px solid #111;padding:6px 12px;border-radius:6px;background:#f6f6f6;display:inline-block;font-style:italic}' +
        '.amt{border:1px solid #111;padding:6px 12px;border-radius:6px;display:inline-block;font-weight:bold}' +
        '.ttd{margin-top:42px;text-align:right;line-height:1.5}@media print{.noprint{display:none}}</style></head><body>' +
        '<div class="kw"><h2>KWITANSI</h2><p class="c muted">'+esc(sekolah)+'</p><hr>' +
        '<div class="row"><div class="l">No. Kwitansi</div><div>: '+esc(no)+'</div></div>' +
        '<div class="row"><div class="l">Nama Toko</div><div>: '+esc(r.namaToko)+'</div></div>' +
        '<div class="row"><div class="l">Terbilang</div><div>: <span class="box">'+esc(terb)+'</span></div></div>' +
        '<div class="row"><div class="l">Uraian Pembayaran</div><div>: '+esc(r.uraian)+' (MAK '+esc(r.kodeMak)+')</div></div>' +
        '<div class="row"><div class="l">Jenjang / Bulan</div><div>: '+esc(r.jenjang||'-')+' / '+esc(r.bulan||'-')+'</div></div>' +
        '<div class="row"><div class="l">Jumlah</div><div>: <span class="amt">'+rupiah(jml)+'</span></div></div>' +
        '<div class="ttd">'+esc(sekolah)+', '+fmtDate(r.tanggal)+'<br>Bendahara,<br><br><br>( .............................. )</div>' +
        '<div class="noprint c" style="margin-top:22px"><button onclick="window.print()" style="padding:9px 18px;font-size:14px;cursor:pointer">Cetak / Simpan PDF</button></div>' +
        '</div></body></html>';
      var win = window.open('', '_blank');
      if (!win){ toast('Popup diblokir.', 'err'); return; }
      win.document.open(); win.document.write(html); win.document.close();
    }

    /* ===================== Realisasi Anggaran ===================== */
    function renderRealisasi(){
      var c = document.getElementById('content');
      c.innerHTML =
        '<div class="panel">' +
          '<h2>Realisasi Anggaran</h2>' +
          '<p class="desc">Perbandingan Pagu (RKKAL) vs Realisasi (Rekap SPJ).</p>' +
          '<div class="grid3">' +
            '<div class="field"><label>Group By</label><select id="realGroup"><option value="akun">Per Kode Akun</option><option value="kegiatan">Per Kegiatan</option></select></div>' +
            '<div class="field"><label>Tahun</label><select id="realTahun">'+tahunOptions('')+'</select></div>' +
            '<div class="field"><label>Jenjang</label><select id="realJenjang">'+jenjangOptions('','Semua')+'</select></div>' +
          '</div>' +
          '<div class="row-actions" style="margin-top:0;margin-bottom:14px"><button class="btn primary" id="realLoad">Tampilkan</button></div>' +
          '<div id="realBox"><div class="empty">Klik Tampilkan.</div></div>' +
        '</div>';
      document.getElementById('realLoad').addEventListener('click', loadRealisasi);
    }

    function loadRealisasi(){
      var groupBy = getVal('realGroup');
      var tahun = getVal('realTahun');
      var jenjang = getVal('realJenjang');
      var box = document.getElementById('realBox');
      box.innerHTML = '<div class="empty">Memuat...</div>';
      gcall('apiGetRealisasi', { schoolId: STATE.schoolId, tahun: tahun || undefined, jenjang: jenjang || undefined, groupBy: groupBy }).then(function(res){
        if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
        if (!res.items || !res.items.length){ box.innerHTML = '<div class="empty">Tidak ada data.</div>'; return; }
        var rows = res.items.map(function(it){
          return '<tr>' +
            '<td class="mono">'+esc(it.kode)+'</td>' +
            '<td>'+esc(it.nama)+'</td>' +
            '<td class="num">'+rupiah(it.pagu)+'</td>' +
            '<td class="num">'+rupiah(it.realisasi)+'</td>' +
            '<td class="num">'+rupiah(it.sisa)+'</td>' +
            '<td class="num">'+it.serapan+'%</td>' +
          '</tr>';
        }).join('');
        box.innerHTML = '<div style="overflow-x:auto"><table><thead><tr><th>Kode</th><th>Nama</th><th class="num">Pagu</th><th class="num">Realisasi</th><th class="num">Sisa</th><th class="num">% Serapan</th></tr></thead>' +
          '<tbody>'+rows+'</tbody>' +
          '<tfoot><tr><th colspan="2" class="right">TOTAL</th><th class="num">'+rupiah(res.totalPagu)+'</th><th class="num">'+rupiah(res.totalRealisasi)+'</th><th class="num">'+rupiah(res.totalSisa)+'</th><th></th></tr></tfoot></table></div>';
      }).catch(function(err){ box.innerHTML = '<div class="empty">Gagal: '+esc(err.message)+'</div>'; });
    }

    /* ===================== Kalkulator Pajak ===================== */
    function renderPajak(){
      var c = document.getElementById('content');
      c.innerHTML =
        '<div class="panel">' +
          '<h2>Kalkulator Pajak Belanja</h2>' +
          '<p class="desc">Hitung PPN & PPh untuk belanja barang/jasa/honor. Default PPN 11%.</p>' +
          '<div class="grid2">' +
            '<div class="field"><label>Nilai (Rp)</label><input id="pjNilai" class="num" inputmode="numeric" placeholder="0"></div>' +
            '<div class="field"><label>Nilai tersebut</label><select id="pjMode"><option value="dpp">Belum termasuk PPN (DPP)</option><option value="incl">Sudah termasuk PPN</option></select></div>' +
            '<div class="field"><label>Jenis Belanja</label><select id="pjJenis"><option value="barang">Barang (PPh Pasal 22)</option><option value="jasa">Jasa (PPh Pasal 23)</option><option value="honor">Honorarium (PPh Pasal 21)</option><option value="none">Tanpa PPh</option></select></div>' +
            '<div class="field"><label>Tarif PPN (%)</label><input id="pjPpn" class="num" inputmode="numeric" value="11"></div>' +
          '</div>' +
          '<div class="field"><label style="font-weight:600"><input type="checkbox" id="pjNpwp" checked style="width:auto;margin-right:7px;vertical-align:middle">Rekanan ber-NPWP <span class="muted">(tanpa NPWP, tarif PPh lebih tinggi)</span></label></div>' +
          '<div id="pjResult"></div>' +
        '</div>';
      ['pjNilai','pjMode','pjJenis','pjPpn','pjNpwp'].forEach(function(id){
        var el = document.getElementById(id);
        el.addEventListener('input', hitungPajak);
        el.addEventListener('change', hitungPajak);
      });
      hitungPajak();
    }
    function hitungPajak(){
      var nilai = parseRupiahJS(document.getElementById('pjNilai').value);
      var mode = document.getElementById('pjMode').value;
      var jenis = document.getElementById('pjJenis').value;
      var ppnRate = (parseFloat(document.getElementById('pjPpn').value)||0)/100;
      var npwp = document.getElementById('pjNpwp').checked;
      var dpp = mode==='incl' ? Math.round(nilai/(1+ppnRate)) : nilai;
      var ppn = Math.round(dpp*ppnRate);
      var pphRate = 0, pphLabel = 'Tanpa PPh';
      if (jenis==='barang'){ pphRate = npwp?0.015:0.03; pphLabel='PPh Pasal 22 ('+(npwp?'1,5':'3')+'%)'; }
      else if (jenis==='jasa'){ pphRate = npwp?0.02:0.04; pphLabel='PPh Pasal 23 ('+(npwp?'2':'4')+'%)'; }
      else if (jenis==='honor'){ pphRate = npwp?0.05:0.06; pphLabel='PPh Pasal 21 ('+(npwp?'5':'6')+'%)'; }
      var pph = Math.round(dpp*pphRate);
      var bruto = dpp+ppn;
      var dibayar = bruto - pph;
      document.getElementById('pjResult').innerHTML =
        '<table>' +
          '<tr><td>Dasar Pengenaan Pajak (DPP)</td><td class="num">'+rupiah(dpp)+'</td></tr>' +
          '<tr><td>PPN ('+(ppnRate*100)+'%)</td><td class="num">'+rupiah(ppn)+'</td></tr>' +
          '<tr><td>'+pphLabel+' (dipotong)</td><td class="num">- '+rupiah(pph)+'</td></tr>' +
          '<tr><th>Nilai Bruto (DPP + PPN)</th><th class="num">'+rupiah(bruto)+'</th></tr>' +
          '<tr><th>Dibayar ke rekanan (Bruto - PPh)</th><th class="num">'+rupiah(dibayar)+'</th></tr>' +
          '<tr><th>Disetor ke negara (PPN + PPh)</th><th class="num">'+rupiah(ppn+pph)+'</th></tr>' +
        '</table>' +
        '<div class="hint" style="margin-top:12px">Estimasi. Tarif dapat berbeda sesuai ketentuan terbaru & status NPWP. PPh 21 honorarium memakai tarif sederhana.</div>';
    }

    /* ===================== Export Laporan ===================== */
    function renderExport(){
      var c = document.getElementById('content');
      c.innerHTML =
        '<div class="panel">' +
          '<h2>Export Rekap SPJ</h2>' +
          '<p class="desc">Unduh data realisasi (arus keluar) dalam format CSV.</p>' +
          '<div class="grid3">' +
            '<div class="field"><label>Tahun</label><select id="expRkpTahun">'+tahunOptions('')+'</select></div>' +
            '<div class="field"><label>Bulan</label><select id="expRkpBulan">'+bulanNamaOptions('')+'</select></div>' +
            '<div class="field"><label>Jenjang</label><select id="expRkpJenjang">'+jenjangOptions('','Semua')+'</select></div>' +
          '</div>' +
          '<div class="row-actions"><button class="btn primary" id="expRekapBtn">Unduh Rekap SPJ (CSV)</button></div>' +
        '</div>' +
        '<div class="panel">' +
          '<h2>Export RKKAL</h2>' +
          '<p class="desc">Unduh data anggaran (arus masuk) dalam format CSV.</p>' +
          '<div class="grid2">' +
            '<div class="field"><label>Tahun</label><select id="expRkkTahun">'+tahunOptions('')+'</select></div>' +
            '<div class="field"><label>Jenjang</label><select id="expRkkJenjang">'+jenjangOptions('','Semua')+'</select></div>' +
          '</div>' +
          '<div class="row-actions"><button class="btn primary" id="expRkkalBtn">Unduh RKKAL (CSV)</button></div>' +
        '</div>' +
        '<div class="panel">' +
          '<h2>Data Contoh (Seed Demo)</h2>' +
          '<p class="desc">Tambahkan data RKKAL & Rekap contoh untuk uji coba.</p>' +
          '<div class="row-actions"><button class="btn ghost" id="seedBtn">+ Isi Data Contoh</button></div>' +
        '</div>';

      document.getElementById('expRekapBtn').addEventListener('click', function(){
        var btn = this; btn.disabled = true;
        gcall('apiExportRekap', { schoolId: STATE.schoolId, tahun: getVal('expRkpTahun') || undefined, bulan: getVal('expRkpBulan') || undefined, jenjang: getVal('expRkpJenjang') || undefined }).then(function(res){
          btn.disabled = false;
          if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
          if (!res.jumlahBaris){ toast('Tidak ada data.', 'err'); return; }
          downloadCsv(res.filename, res.content);
          toast(res.jumlahBaris + ' baris diekspor.', 'ok');
        }).catch(function(err){ btn.disabled=false; toast('Gagal: '+err.message, 'err'); });
      });

      document.getElementById('expRkkalBtn').addEventListener('click', function(){
        var btn = this; btn.disabled = true;
        gcall('apiExportRKKAL', { schoolId: STATE.schoolId, tahun: getVal('expRkkTahun') || undefined, jenjang: getVal('expRkkJenjang') || undefined }).then(function(res){
          btn.disabled = false;
          if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
          if (!res.jumlahBaris){ toast('Tidak ada data.', 'err'); return; }
          downloadCsv(res.filename, res.content);
          toast(res.jumlahBaris + ' baris diekspor.', 'ok');
        }).catch(function(err){ btn.disabled=false; toast('Gagal: '+err.message, 'err'); });
      });

      document.getElementById('seedBtn').addEventListener('click', function(){
        if (!confirm('Tambahkan data contoh?')) return;
        var btn = this; btn.disabled = true;
        gcall('apiSeedDummy', { schoolId: STATE.schoolId }).then(function(res){
          btn.disabled = false;
          if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
          toast('Demo: '+res.rkkal+' RKKAL, '+res.rekap+' Rekap ditambahkan.', 'ok');
        }).catch(function(err){ btn.disabled=false; toast('Gagal: '+err.message, 'err'); });
      });
    }

    function downloadCsv(filename, content){
      var blob = new Blob(['\ufeff'+content], {type:'text/csv;charset=utf-8;'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename || 'export.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    /* ===================== Pengaturan Sekolah ===================== */
    function renderPengaturan(){
      var c = document.getElementById('content');
      c.innerHTML =
        '<div class="panel">' +
          '<h2>Profil Sekolah</h2>' +
          '<p class="desc">Identitas ini dipakai pada laporan SPJ dan kwitansi.</p>' +
          '<div class="grid2">' +
            '<div class="field"><label>Nama Sekolah</label><input id="pfNama"></div>' +
            '<div class="field"><label>Kepala Sekolah</label><input id="pfKepala"></div>' +
            '<div class="field"><label>Bendahara</label><input id="pfBendahara"></div>' +
            '<div class="field"><label>Alamat</label><input id="pfAlamat"></div>' +
          '</div>' +
          '<div class="row-actions"><button class="btn primary" id="pfSave">Simpan Profil</button></div>' +
        '</div>' +
        '<div class="panel">' +
          '<h2>Diagnostik Sistem</h2>' +
          '<p class="desc">Informasi teknis dan status koneksi.</p>' +
          '<div id="diagBox"><div class="empty">Memuat...</div></div>' +
          '<div class="row-actions"><button class="btn ghost" id="diagBtn">Refresh Diagnostik</button></div>' +
        '</div>';

      // Load school profile
      gcall('apiGetSchool', { schoolId: STATE.schoolId }).then(function(res){
        if (res && res.ok && res.school){
          var s = res.school;
          val('pfNama', s.namaSekolah); val('pfKepala', s.kepalaSekolah);
          val('pfBendahara', s.bendahara); val('pfAlamat', s.alamat);
        }
      }).catch(function(err){ toast('Gagal memuat profil: '+err.message, 'err'); });

      document.getElementById('pfSave').addEventListener('click', function(){

          schoolId: STATE.schoolId,
          namaSekolah: getVal('pfNama'), kepalaSekolah: getVal('pfKepala'),
          bendahara: getVal('pfBendahara'), alamat: getVal('pfAlamat')
        };
        gcall('apiSaveSchool', payload).then(function(res){
          if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
          STATE.schoolName = payload.namaSekolah || STATE.schoolName;
          document.getElementById('schoolName').textContent = STATE.schoolName;
          toast('Profil tersimpan.', 'ok');
        }).catch(function(err){ toast('Gagal: '+err.message, 'err'); });
      });

      document.getElementById('diagBtn').addEventListener('click', loadDiagnostics);
      loadDiagnostics();
    }

    function loadDiagnostics(){
      var box = document.getElementById('diagBox');
      box.innerHTML = '<div class="empty">Memuat...</div>';
      gcall('apiDiagnostics', null).then(function(res){
        if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
        box.innerHTML =
          '<table>' +
            '<tr><td>Spreadsheet URL</td><td><a href="'+esc(res.spreadsheetUrl)+'" target="_blank" class="mono" style="color:var(--accent)">Buka</a></td></tr>' +
            '<tr><td>Baris RKKAL</td><td>'+res.rkkalRows+'</td></tr>' +
            '<tr><td>Baris Rekap</td><td>'+res.rekapRows+'</td></tr>' +
            '<tr><td>Baris Sekolah</td><td>'+res.sekolahRows+'</td></tr>' +
            '<tr><td>Server Time</td><td class="mono">'+esc(res.serverTime)+'</td></tr>' +
          '</table>';
      }).catch(function(err){ box.innerHTML = '<div class="empty">Gagal: '+esc(err.message)+'</div>'; });
    }

    /* ===================== Boot ===================== */
    function boot(){
      gcall('apiBootstrap', null).then(function(res){
        if (!res || !res.ok) throw new Error((res && res.error) || 'Bootstrap gagal');
        STATE.schoolId = res.schoolId;
        STATE.refs = res.refs || {};
        STATE.schoolName = (res.schools && res.schools[0] && res.schools[0].nama) || 'Sekolah Rakyat';
        document.getElementById('schoolName').textContent = STATE.schoolName;
        document.getElementById('schoolId').textContent = res.schoolId || '';
        if (res.spreadsheetUrl){
          var link = document.getElementById('sheetLink');
          link.href = res.spreadsheetUrl;
          link.style.display = 'block';
        }
        navigate('dashboard');
      }).catch(function(err){
        document.getElementById('schoolName').textContent = 'Gagal terhubung';
        toast('Bootstrap: ' + err.message, 'err');
        navigate('dashboard');
      });
    }

    // Wire nav + refresh
    document.getElementById('nav').addEventListener('click', function(e){
      var btn = e.target.closest ? e.target.closest('button[data-page]') : null;
      if (!btn){ var t=e.target; while(t && t!==this){ if(t.getAttribute && t.getAttribute('data-page')){btn=t;break;} t=t.parentNode; } }
      if (btn) navigate(btn.getAttribute('data-page'));
    });
    document.getElementById('refreshBtn').addEventListener('click', function(){
      var active = document.querySelector('#nav button.active');
      navigate(active ? active.getAttribute('data-page') : 'dashboard');
    });

    boot();
  </script>
